<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Направления — bridge42worlds</title>
<meta name="description" content="Тематические направления архива: подборки разобранных работ по одной большой теме, с полками и живыми карточками.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=c1bee06f11">
<style>
  /* НАПРАВЛЕНИЕ — ПРИЗНАК ПОВЕРХ АРХИВА, А НЕ ЕЩЁ ОДИН ТЕГ. Владелец 18.09: «как я их найду,
     мне надо отдельный признак на эту тему, в том числе если у нас что-то есть». Теги и
     понятия рождаются из текста и живут своей жизнью; направление — решение человека:
     «эти работы мы собираем вместе, потому что так сейчас идёт наука». Список номеров
     лежит в data/directions.json, карточки берутся живыми из /api/cards (тело статично,
     обвязка динамична): ни одной пересборки ради подборки.

     Страница одна на все языки, как research.html: язык параметром ?lang=, направление
     параметром ?d=. Без ?d — оглавление направлений. */
  .top-bar{display:flex;justify-content:space-between;align-items:center;
    max-width:var(--col-wide, 1100px);margin:0 auto 18px;padding:16px 16px 0}
  .logo{font-family:var(--font-display);font-size:15px;color:var(--soft);text-decoration:none}
  .logo:hover{color:var(--accent)}
  .theme-toggle{background:none;border:1px solid var(--line, var(--hair));color:var(--soft);
    border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px}

  .d-wrap{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 60px}
  .d-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ochre);margin-bottom:8px}
  .d-head h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin-bottom:10px;text-wrap:balance}
  .d-lead{max-width:70ch;font-size:15px;line-height:1.72;color:var(--text)}
  .d-sub{color:var(--soft);font-size:13.5px;margin-top:10px;font-family:var(--mono)}

  .d-shelf{margin-top:38px}
  .d-shelf h2{font-family:var(--font-display);font-size:clamp(20px,3vw,26px);line-height:1.2;
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .d-shelf h2 .n{font-family:var(--mono);font-size:12px;color:var(--soft);font-weight:400}
  .d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .d-card{border:1px solid var(--line, var(--hair));border-radius:14px;background:var(--surface);
    padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s, transform .2s}
  .d-card:hover{border-color:color-mix(in srgb, var(--ochre) 45%, var(--hair));transform:translateY(-1px)}
  .d-card .m{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--soft)}
  .d-card .m .ours{color:var(--ochre)}
  .d-card h3{font-family:var(--font-display);font-size:16px;line-height:1.35;margin:0}
  .d-card h3 a{color:var(--ink);text-decoration:none}
  .d-card h3 a:hover{color:var(--link)}
  .d-card p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0}
  .d-card .cov{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:var(--tag-bg, var(--bg))}
  .d-card .f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--soft);margin-top:auto;padding-top:6px}
  .d-card .f a{color:var(--link);text-decoration:none}
  .d-pending{border-style:dashed;opacity:.75}
  .d-pending p{font-style:italic}

  .d-index{display:grid;gap:14px;margin-top:26px}
  .d-item{border:1px solid var(--line, var(--hair));border-radius:14px;background:var(--surface);padding:18px 20px}
  .d-item a{font-family:var(--font-display);font-size:20px;color:var(--ink);text-decoration:none}
  .d-item a:hover{color:var(--link)}
  .d-item p{margin-top:8px;font-size:14px;line-height:1.65;color:var(--muted);max-width:70ch}
  .d-empty{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:640px){ .d-card{padding:12px 13px} }
</style>
<script>
(function () {
  var allowed = ['ru', 'en', 'es', 'ar', 'fr'];
  var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  var saved = null;
  try { saved = localStorage.getItem('b42_lang'); } catch (e) {}
  var lang = allowed.indexOf(q) >= 0 ? q : (allowed.indexOf(saved) >= 0 ? saved : 'ru');
  window.B42_LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  try { localStorage.setItem('b42_lang', lang); } catch (e) {}
})();
</script>
<link rel="canonical" href="https://bridge42worlds.academy/directions.html">
</head>
<body>

<div class="top-bar">
  <a href="/learn.html" class="logo">bridge42worlds</a>
  <button type="button" class="theme-toggle" onclick="var h=document.documentElement;h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');">◐</button>
</div>

<div class="d-wrap">
  <div class="d-head">
    <div class="d-eyebrow" id="eyebrow"></div>
    <h1 id="h"></h1>
    <p class="d-lead" id="lead"></p>
    <div class="d-sub" id="sub"></div>
  </div>
  <div id="root"></div>
</div>

<script>
(function () {
  var LANG = window.B42_LANG || 'ru';
  var API = (typeof window.B42_API === 'string' ? window.B42_API : '');
  var root = document.getElementById('root');
  var KEY = (location.search.match(/[?&]d=([a-z0-9_-]+)/) || [])[1] || '';

  var UI = {
    ru: { all: 'Направления', eyebrow: 'Направление', works: 'работ', opened: 'открыто',
          pending: 'Разбор идёт — карточка появится, когда работа будет готова.',
          ours: 'уже в архиве', back: '← все направления', empty: 'Пока пусто.' },
    en: { all: 'Directions', eyebrow: 'Direction', works: 'works', opened: 'opened',
          pending: 'Analysis in progress — the card appears once the work is ready.',
          ours: 'already in the archive', back: '← all directions', empty: 'Nothing yet.' },
    es: { all: 'Direcciones', eyebrow: 'Dirección', works: 'trabajos', opened: 'abierta',
          pending: 'Análisis en curso: la tarjeta aparecerá cuando el trabajo esté listo.',
          ours: 'ya en el archivo', back: '← todas las direcciones', empty: 'Aún vacío.' },
    ar: { all: 'الاتجاهات', eyebrow: 'اتجاه', works: 'أعمال', opened: 'افتُتح',
          pending: 'التحليل جارٍ — تظهر البطاقة عند اكتمال العمل.',
          ours: 'موجود في الأرشيف', back: '← كل الاتجاهات', empty: 'لا شيء بعد.' },
    fr: { all: 'Directions', eyebrow: 'Direction', works: 'travaux', opened: 'ouverte',
          pending: 'Analyse en cours : la fiche apparaît dès que le travail est prêt.',
          ours: 'déjà dans les archives', back: '← toutes les directions', empty: 'Rien pour l’instant.' }
  }[LANG] || {};

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function t(o) { return (o && (o[LANG] || o.en || o.ru)) || ''; }

  /* /api/cards отдаёт не больше сорока за раз — режем список на куски и склеиваем.
     Порядок сохраняем тот, что в файле: полка читается сверху вниз как задумано. */
  function cards(ids) {
    var chunks = [];
    for (var i = 0; i < ids.length; i += 40) chunks.push(ids.slice(i, i + 40));
    return Promise.all(chunks.map(function (c) {
      return fetch(API + '/api/cards?lang=' + encodeURIComponent(LANG) + '&version=popular&ids=' +
                   encodeURIComponent(c.join(',')))
        .then(function (r) { return r.ok ? r.json() : { items: [] }; })
        .then(function (j) { return (j && j.items) || []; })
        .catch(function () { return []; });
    })).then(function (parts) {
      var by = {};
      parts.forEach(function (p) { p.forEach(function (it) { by[it.id] = it; }); });
      return by;
    });
  }

  function card(id, it) {
    var c = el('div', 'd-card' + (it ? '' : ' d-pending'));
    if (!it) {
      c.innerHTML = '<div class="m"><span>arXiv:' + esc(id) + '</span></div>' +
                    '<p>' + esc(UI.pending) + '</p>' +
                    '<div class="f"><a href="https://arxiv.org/abs/' + esc(id) + '" target="_blank" rel="noopener">arXiv</a></div>';
      return c;
    }
    var base = '/lang/' + LANG + '/archive/' + it.date + '/' + it.id + '/';
    var cover = '/lang/ru/archive/' + it.date + '/' + it.id + '/t_ai.webp';
    var cat = (it.categories || [])[0] || it.primary_category || '';
    c.innerHTML =
      '<div class="m"><span>' + esc(cat) + '</span><span>' + esc(it.date || '') + '</span></div>' +
      (it.image !== false ? '<img class="cov" loading="lazy" alt="" src="' + esc(cover) + '" onerror="this.remove()">' : '') +
      '<h3><a href="' + esc(base) + '">' + esc(it.title || it.id) + '</a></h3>' +
      '<p>' + esc(it.description || it.oneliner || '') + '</p>' +
      '<div class="f"><a href="' + esc(base) + 'advanced.html">' + esc({ru:'Подробно',en:'Advanced',es:'A fondo',ar:'بالتفصيل',fr:'En détail'}[LANG] || 'Advanced') + '</a>' +
      '<a href="https://arxiv.org/abs/' + esc(it.id) + '" target="_blank" rel="noopener">arXiv:' + esc(it.id) + '</a></div>';
    return c;
  }

  fetch('/data/directions.json?v=' + Math.floor(Date.now() / 600000))
    .then(function (r) { if (!r.ok) throw new Error('directions.json ' + r.status); return r.json(); })
    .then(function (D) {
      var keys = Object.keys(D);
      if (!KEY || !D[KEY]) {
        document.getElementById('h').textContent = UI.all;
        document.getElementById('eyebrow').textContent = 'bridge42worlds';
        var list = el('div', 'd-index');
        keys.forEach(function (k) {
          var d = D[k], n = (d.groups || []).reduce(function (s, g) { return s + g.ids.length; }, 0);
          var it = el('div', 'd-item');
          it.innerHTML = '<a href="/directions.html?lang=' + LANG + '&d=' + esc(k) + '">' + esc(t(d.title)) + '</a>' +
                         '<p>' + esc(t(d.lead)) + '</p>' +
                         '<div class="d-sub">' + n + ' ' + esc(UI.works) + (d.opened ? ' · ' + esc(UI.opened) + ' ' + esc(d.opened) : '') + '</div>';
          list.appendChild(it);
        });
        root.appendChild(list);
        return;
      }
      var d = D[KEY];
      document.title = t(d.title) + ' — bridge42worlds';
      document.getElementById('eyebrow').innerHTML = '<a href="/directions.html?lang=' + LANG + '" style="color:inherit;text-decoration:none">' + esc(UI.back) + '</a>';
      document.getElementById('h').textContent = t(d.title);
      document.getElementById('lead').textContent = t(d.lead);
      var all = [];
      (d.groups || []).forEach(function (g) { all = all.concat(g.ids); });
      document.getElementById('sub').textContent = all.length + ' ' + UI.works + (d.opened ? ' · ' + UI.opened + ' ' + d.opened : '');
      cards(all).then(function (by) {
        (d.groups || []).forEach(function (g) {
          var sh = el('section', 'd-shelf');
          var h2 = el('h2', null, t(g.title));
          var ready = g.ids.filter(function (i) { return by[i]; }).length;
          h2.appendChild(el('span', 'n', ready + '/' + g.ids.length));
          sh.appendChild(h2);
          var grid = el('div', 'd-grid');
          // Готовые — вперёд, ждущие разбора — в хвост полки: страница показывает
          // что есть, а не что обещано.
          g.ids.slice().sort(function (a, b) { return (by[b] ? 1 : 0) - (by[a] ? 1 : 0); })
            .forEach(function (i) { grid.appendChild(card(i, by[i])); });
          sh.appendChild(grid);
          root.appendChild(sh);
        });
        if (!all.length) root.appendChild(el('div', 'd-empty', UI.empty));
      });
    })
    .catch(function (e) { root.appendChild(el('div', 'd-empty', String(e))); });
})();
</script>
<script src="/js/course-i18n.js?v=0b472a78b9"></script>
