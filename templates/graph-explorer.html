<!DOCTYPE html>
<html lang="$lang" dir="$dir">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$graph_title — bridge42worlds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Source+Serif+4:opsz@8..60&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/search-ui.css">
    <script data-goatcounter="https://$goatcounter.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

<div class="top-bar">
    <a href="/lang/$lang/index.html" class="logo">bridge42worlds</a>
    <div class="header-right">
        <div class="nav-links">
            <!-- authors / graph / analytics живут в «ещё» (js/sitenav.js), а не в шапке.
                 Владелец 2026-08-02: «опять меню засорилось». Причина не в конкретном пункте:
                 список разделов дублировался В ДВУХ местах — в шаблонах и в sitenav.js, —
                 и каждый новый раздел дописывали в оба, отчего шапка росла сама собой.
                 В шапке держим ПЯТЬ основных; остальное открывается кнопкой «ещё». -->
            <a href="/lang/$lang/index.html">main</a>
            <a href="/lang/$lang/laws/">concepts</a>
            <a href="/lang/$lang/scientists/">scientists</a>
            <a href="/lang/$lang/sections/">sections</a>
            <a href="/learn.html" title="learn" class="nav-ic"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2 2 0 0 1 6 5h5v14H6a2 2 0 0 0-2 1.5z"/><path d="M20 6.5A2 2 0 0 0 18 5h-5v14h5a2 2 0 0 1 2 1.5z"/></svg></a>
            <a class="nav-ic" href="/lang/$lang/favorites.html" title="$fav_title"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6l2.45 5 5.5.7-4 3.85 1 5.45-4.95-2.65-4.95 2.65 1-5.45-4-3.85 5.5-.7Z"/></svg></a>
        </div>
        $version_toggle_html
    </div>
</div>

<div class="langs" id="langs-bar"></div>

<h1 class="kg-h1"><svg class="ico-graph" viewBox="0 0 25 25" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><line x1="4.5" y1="7" x2="20.5" y2="5"/><line x1="5.5" y1="9" x2="12" y2="20"/><line x1="20" y1="7" x2="13.5" y2="20"/></g><g fill="currentColor"><circle cx="4.5" cy="7" r="2.9"/><circle cx="20.5" cy="5" r="2.9"/><circle cx="12.5" cy="21" r="2.9"/></g></svg> $graph_title</h1>
<p class="kg-notice">$graph_warning</p>

<div class="kg-controls">
    <div class="kg-row kg-filter-row">
        <span class="kg-search-wrap">
            <input type="text" id="kg-search-tag" class="kg-search-input" placeholder="$search_tag_placeholder" autocomplete="off">
            <div class="kg-suggest" id="kg-suggest-tag"></div>
        </span>
        <span class="kg-search-wrap">
            <input type="text" id="kg-search-law" class="kg-search-input" placeholder="$search_law_placeholder" autocomplete="off">
            <div class="kg-suggest" id="kg-suggest-law"></div>
        </span>
        <span class="kg-search-wrap">
            <input type="text" id="kg-search-sci" class="kg-search-input" placeholder="$search_sci_placeholder" autocomplete="off">
            <div class="kg-suggest" id="kg-suggest-sci"></div>
        </span>
        <button type="button" id="kg-search-clear" title="$clear_label">✕</button>
        <span class="kg-sep"></span>
        <!-- Слово «Глубина» убрано: пара «− 1 +» уже читается сама, и ровно такой контрол
             без подписи давно стоит на карточках тега/закона/учёного (.mini-depth-ctrl).
             Подпись остаётся для читалок с экрана и как всплывающая. -->
        <span class="kg-depth" role="group" aria-label="$depth_label" title="$depth_label">
          <button type="button" id="kg-depth-minus">−</button>
          <span id="kg-depth-val">1</span>
          <button type="button" id="kg-depth-plus">+</button>
        </span>
    </div>
    <div class="kg-chips" id="kg-chips-all"></div>
    <div class="kg-row"><strong>$nodes_label</strong>
        <label><input type="checkbox" class="kg-kind" value="tag"> <span style="color:#6C5CE7">●</span> $tags_label</label>
        <label><input type="checkbox" class="kg-kind" value="law" checked> <span style="color:#D64545">●</span> $laws_label</label>
        <label><input type="checkbox" class="kg-kind" value="sci" checked> <span style="color:#2FA84F">●</span> $scientists_label</label>
        <span class="kg-sep"></span>
        <strong>$edges_label</strong>
        <label><input type="checkbox" class="kg-edge" value="tag-tag"> $edge_tag_tag</label>
        <label><input type="checkbox" class="kg-edge" value="law-law"> $edge_law_law</label>
        <label><input type="checkbox" class="kg-edge" value="sci-sci"> $edge_sci_sci</label>
        <label><input type="checkbox" class="kg-edge" value="law-tag"> $edge_tag_law</label>
        <label><input type="checkbox" class="kg-edge" value="sci-tag"> $edge_tag_sci</label>
        <label><input type="checkbox" class="kg-edge" value="law-sci" checked> $edge_law_sci</label>
        <label><input type="checkbox" class="kg-edge" value="law-influence" checked> $edge_law_influence</label>
    </div>
    <!-- Виды понятий (решение владельца 18.08: одна классификация, «в графе можно ставить
         галочки на группе классификации, и будет чище»). Тринадцать видов — это тринадцать
         галочек, на телефоне месиво; поэтому основная единица здесь ГРУППА, а виды внутри
         неё раскрываются на широком экране. Пустой набор галочек = показываем всё:
         фильтр, который по умолчанию всё скрывает, читатель воспринимает как поломку. -->
    <div class="kg-row kg-kinds-row"><strong>$kinds_label</strong>
        <span class="kg-group">
            <label class="kg-group-t"><input type="checkbox" class="kg-group-all" data-group="frame"> $group_frame</label>
            <span class="kg-subs">
                <label><input type="checkbox" class="kg-sub" data-group="frame" value="law"> $kind_law</label>
                <label><input type="checkbox" class="kg-sub" data-group="frame" value="principle"> $kind_principle</label>
                <label><input type="checkbox" class="kg-sub" data-group="frame" value="theorem"> $kind_theorem</label>
            </span>
        </span>
        <span class="kg-group">
            <label class="kg-group-t"><input type="checkbox" class="kg-group-all" data-group="method"> $group_method</label>
            <span class="kg-subs">
                <label><input type="checkbox" class="kg-sub" data-group="method" value="method"> $kind_method</label>
                <label><input type="checkbox" class="kg-sub" data-group="method" value="instrument"> $kind_instrument</label>
                <label><input type="checkbox" class="kg-sub" data-group="method" value="equation"> $kind_equation</label>
                <label><input type="checkbox" class="kg-sub" data-group="method" value="invention"> $kind_invention</label>
            </span>
        </span>
        <span class="kg-group">
            <label class="kg-group-t"><input type="checkbox" class="kg-group-all" data-group="object"> $group_object</label>
            <span class="kg-subs">
                <label><input type="checkbox" class="kg-sub" data-group="object" value="object"> $kind_object</label>
                <label><input type="checkbox" class="kg-sub" data-group="object" value="substance"> $kind_substance</label>
                <label><input type="checkbox" class="kg-sub" data-group="object" value="phenomenon"> $kind_phenomenon</label>
                <label><input type="checkbox" class="kg-sub" data-group="object" value="effect"> $kind_effect</label>
            </span>
        </span>
        <span class="kg-group">
            <label class="kg-group-t"><input type="checkbox" class="kg-group-all" data-group="idea"> $group_idea</label>
            <span class="kg-subs">
                <label><input type="checkbox" class="kg-sub" data-group="idea" value="concept"> $kind_concept</label>
                <label><input type="checkbox" class="kg-sub" data-group="idea" value="math"> $kind_math</label>
            </span>
        </span>
        <button type="button" id="kg-kinds-clear">$clear_label</button>
    </div>
    <div class="kg-row"><strong>$presets_label</strong>
        <button type="button" onclick="kgPreset('core')">$preset_core</button>
        <button type="button" onclick="kgPreset('all')">$preset_all</button>
        <button type="button" onclick="kgPreset('tag-sci')">$edge_tag_sci</button>
        <button type="button" onclick="kgPreset('law-sci')">$edge_law_sci</button>
        <button type="button" onclick="kgPreset('law-tag')">$edge_tag_law</button>
        <button type="button" onclick="kgPreset('tags')">$tags_label</button>
        <button type="button" onclick="kgPreset('laws')">$laws_label</button>
        <button type="button" onclick="kgPreset('sci')">$scientists_label</button>
    </div>
</div>

<div id="kg-graph"><div class="kg-loader" id="kg-loader">$loading_text</div><canvas id="kgcanvas"></canvas></div>

<footer><p>bridge42worlds </p></footer>
<script src="/js/likes.js"></script>
<script src="/js/icons.js"></script>
    <script src="/js/search.js"></script>
<script src="/js/site-search.js"></script>
<script src="/js/waiting.js"></script>
<script src="/js/search-ui.js"></script>
<script src="/js/force-graph.js"></script>
<script src="/js/knowledge-graph.js"></script>
<script src="/js/beta-banner.js" defer></script>
</body>
</html>
