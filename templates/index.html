<!DOCTYPE html>
<html lang="$lang" dir="$dir">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bridge42worlds — Science Made Simple</title>
    <link rel="alternate" type="application/atom+xml" title="bridge42worlds ($lang)" href="/feed-$lang.xml">
    $og_meta_html
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Source+Serif+4:opsz@8..60&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/search-ui.css">
    <script data-goatcounter="https://$goatcounter.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>
<div class="top-bar">
    <div class="brand-row">
        <span class="logo-wrap">
            <a href="/lang/$lang/index.html" class="logo">bridge42worlds</a><button type="button" id="intro-toggle" class="logo-info" title="$about_title">i</button>
            <div class="intro-popup" id="intro-popup">
                <p class="home-intro" id="home-intro">$intro_html</p>
                <a class="intro-more" href="/lang/$lang/about.html">$about_title →</a>
            </div>
        </span>
        <div class="hdr-icons">
            <div class="search-bar">
                <button type="button" id="search-toggle-btn" class="cal-btn" title="$search_placeholder"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M15.8 15.8L21 21"/></svg></button>
                <div class="search-panel" id="search-panel">
                    <div class="search-row">
                        <input type="text" class="search-box" placeholder="$search_placeholder" oninput="doSearch(this.value)">
                        <button type="button" class="search-clear" onclick="clearSearch()" title="Clear">✕</button>
                    </div>
                    <div class="search-hint">$search_hint</div>
                    <label class="express-filter"><input type="checkbox" id="express-filter-toggle"><span id="express-filter-label"></span></label>
                    <label class="express-filter"><input type="checkbox" id="advice-filter-toggle"><span id="advice-filter-label"></span></label>
                </div>
            </div>
            <div class="cal-bar">
                <button type="button" id="calendar-btn" class="cal-btn" title="$calendar_title"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="5" width="17.6" height="16" rx="2.2"/><path d="M3.2 10h17.6"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 17.6h.01"/><path d="M12 17.6h.01"/></svg></button>
                <div class="calendar-panel" id="calendar-panel"></div>
            </div>
        </div>
    </div>
    <div class="header-right">
        <div class="nav-links">
            <a href="/lang/$lang/index.html" class="active">main</a>
            <a href="/lang/$lang/concepts/">concepts</a>
            <a href="/lang/$lang/scientists/">scientists</a>
            <a href="/lang/$lang/sections/">sections</a>
            <!-- authors / graph / analytics живут в «ещё» (js/sitenav.js), а не в шапке.
                 Владелец 2026-08-02: «опять меню засорилось, сколько можно». Причина не в
                 конкретном пункте: список разделов дублируется В ДВУХ местах — здесь и в
                 sitenav.js, — и каждый новый раздел дописывают в оба, отчего шапка растёт
                 сама собой. В шапке держим ПЯТЬ основных; всё остальное открывается кнопкой
                 «ещё», где список один и полный. -->
            <a href="/learn.html" title="learn" class="nav-ic"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2 2 0 0 1 6 5h5v14H6a2 2 0 0 0-2 1.5z"/><path d="M20 6.5A2 2 0 0 0 18 5h-5v14h5a2 2 0 0 1 2 1.5z"/></svg></a>
            <a class="nav-ic" href="/lang/$lang/favorites.html" title="$fav_title"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6l2.45 5 5.5.7-4 3.85 1 5.45-4.95-2.65-4.95 2.65 1-5.45-4-3.85 5.5-.7Z"/></svg></a>
        </div>
        $version_toggle_html
    </div>
</div>
<div class="langs-row">
    <div class="langs" id="langs-bar"></div>
</div>
<script>
(function () {
    // Окно «о проекте» БОЛЬШЕ НЕ ОТКРЫВАЕТСЯ САМО при первом заходе (владелец 2026-08-02:
    // «убери это окно при первом заходе, кто хочет — нажмёт i»). Человек пришёл читать
    // статьи, а не объяснение про сайт; всплывашка на входе закрывает ленту и раздражает
    // ровно тех, кого мы хотим удержать. Кнопка «i» рядом с логотипом никуда не делась.
    var popup = document.getElementById('intro-popup'), btn = document.getElementById('intro-toggle');
    if (!popup || !btn) return;
    function setOpen(v) { popup.classList.toggle('open', v); btn.classList.toggle('active', v); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!popup.classList.contains('open')); });
    document.addEventListener('click', function (e) {
        if (popup.classList.contains('open') && !popup.contains(e.target) && e.target !== btn) setOpen(false);
    });
})();
</script>
<div class="category-bar" id="category-bar"></div>
<div class="site-stats" id="site-stats"></div>
<div class="filters" id="active-filters"></div>
<div id="search-results"><div class="b42-loader">$loading_text</div></div>
<footer><p>bridge42worlds · <a href="/feed-$lang.xml">RSS</a> </p></footer>
<script src="/js/likes.js"></script>
<script src="/js/icons.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/carousel.js" defer></script>
<script src="/js/site-search.js"></script>
<script src="/js/waiting.js"></script>
<script src="/js/search-ui.js"></script>
<script src="/js/beta-banner.js" defer></script>
</body>
</html>
