    <button type="button" id="view-structured" class="active" aria-label="Sections">▤</button>
    <button type="button" id="view-treemap" aria-label="Map">▦</button>

</div>

<div id="treeview"></div>
<div id="treemap" style="display:none"></div>
<div class="tag-cloud" id="tag-cloud" style="display:none">$tags_cloud_html</div>
<div id="tag-graph" style="display:none">
    <div class="mini-graph-config">$mini_graph_filters_html</div>
    <div class="mini-graph mini-graph--full" data-node="">
        <canvas id="minigraph"></canvas>
    </div>
</div>

<footer><p>bridge42worlds </p></footer>
<script src="/js/likes.js"></script>
<script src="/js/icons.js"></script>
    <script src="/js/search.js"></script>
<script src="/js/site-search.js"></script>
<script src="/js/waiting.js"></script>
<script src="/js/search-ui.js"></script>
<script src="/js/force-graph.js"></script>
<script src="/js/mini-graph.js"></script>
<script>window.__TREEMAP = $treemap_data;</script>
<script src="/js/treeview.js"></script>
<script src="/js/treemap.js"></script>
<script>
(function(){
  var V={structured:'treeview',treemap:'treemap',list:'tag-cloud',graph:'tag-graph'};
  var B={structured:'view-structured',treemap:'view-treemap',list:'view-list',graph:'view-graph'};
  function set(name){
    for(var k in V){var el=document.getElementById(V[k]);if(el)el.style.display=(k===name)?'':'none';
      var b=document.getElementById(B[k]);if(b)b.classList.toggle('active',k===name);}
    if(name==='graph'&&window.__miniResize)window.__miniResize();
    if(name==='treemap'&&window.__treemapRender)window.__treemapRender();
    try{localStorage.setItem('b42_tagview',name);}catch(e){}
  }
  Object.keys(B).forEach(function(k){document.getElementById(B[k]).onclick=function(){set(k);};});
  // На телефоне дефолт — список: структура/тримап на 375 нечитаемы (владелец 2026-07-30).
  var _def=(window.matchMedia&&matchMedia('(max-width: 640px)').matches)?'list':'structured';
  var saved=_def;try{saved=localStorage.getItem('b42_tagview')||_def;}catch(e){}
  if(!V[saved])saved='structured';
  set(saved);
})();
</script>
<script src="/js/beta-banner.js" defer></script>
</body>
</html>
