# Испытательный Worker. Отдельный файл, а не правка боевого конфига: правка боевого —
# это ровно тот способ, которым однажды выкатывают недоделанное. Здесь то же имя кода и те же
# привязки, но БЕЗ маршрутов на домен и БЕЗ расписаний: он доступен только по адресу
# workers.dev и никого не обслуживает.
#
# База D1 та же, что у прода, — поиск из неё только читает. Заводить копию базы ради чтения
# значило бы проверять поиск не на тех данных, на которых он будет работать.
#
#     python cloudflare/deploy_worker.py --dev
# Cloudflare Worker + R2 — конфиг переезда сайта с GitHub Pages (подготовлено 2026-07-24, НЕ развёрнуто).
# Активируется, когда у нас будет аккаунт Cloudflare + API-токен (см. cloudflare/MIGRATION.md).
name = "bridge42worlds-dev"
main = "worker.js"
compatibility_date = "2026-07-24"
# Держим workers.dev-ссылку живой для тестов и на будущее, помимо продовых routes ниже.
workers_dev = true


# Очередь заказов — один каркас на троих: вопрос боту, «хочу статью», «переведи на мой язык».
# Схема и объяснение решений — cloudflare/schema-queue.sql. Исполняет заказы машина с данными
# (та же, что daily): Worker принимает и показывает статус, но сам ничего не генерирует —
# у него нет ни файлов, ни реестров.
[[d1_databases]]
binding = "QUEUE"
database_name = "b42-queue"
database_id = "44ca0737-e27f-4cb5-bac8-9b132c935e4d"

# Карточки статей для поиска — ОТДЕЛЬНАЯ база, не b42-queue. Это не вкусовщина: 5 августа
# 2026 массовая заливка 30 тысяч карточек в общую базу положила её на несколько минут —
# /api/council/members и реакции читателей отвечали 500, пока шла запись. Данные уцелели,
# но урок однозначен: пересобираемое (поиск) и невосстановимое (голоса совета, реакции)
# не должны делить одну базу, потому что первое пишется пачками, а второе обязано отвечать.
[[d1_databases]]
binding = "CARDS"
database_name = "b42-cards"
database_id = "f865c642-7478-4a52-930b-9b47f2b4a7fb"


# Нормы расхода. Держим настройкой, а не константами в коде: числа будем крутить, когда увидим
# реальное поведение читателей, и менять их выкладкой кода — плохая идея.
[vars]
# Нормы подняты 2026-08-02 (владелец: «увеличь, всё равно пока никто не пользуется»).
# Расчёт, а не на глаз: один семантический поиск — это эмбеддинг запроса (доли цента за
# тысячу) плюс обращение к Vectorize. Даже при сотне читателей в день с новой нормой
# расход остаётся в единицах долларов в месяц, а прежние 3 запроса анониму в сутки
# отсекали живого человека на втором вопросе — он уходил, не поняв, что поиск умеет.
# Сторож остаётся: он защищает от чужого робота, а не от нашего читателя.
QUOTA_DAY_USER = "60"       # вопросов в сутки на одного читателя
QUOTA_WEEK_USER = "250"      # и за неделю — чтобы суточную норму не растягивали на семь дней
QUOTA_DAY_PROJECT = "2000"  # предохранитель на весь проект: счёт не уедет, даже если ошиблись
QUOTA_DAY_ANON = "12"        # анонимному — попробовать; вход должен давать понятную выгоду,
QUOTA_WEEK_ANON = "40"       # а не выглядеть вымогательством на пустом месте

# Секреты входа (НЕ здесь, шифруются на стороне Cloudflare — wrangler secret put):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  — вход через Google
#   TURNSTILE_SECRET                        — проверка «не робот»
#   RESEND_API_KEY, MAIL_FROM               — отправка одноразовых кодов на почту

# Хранилище статики (HTML/JSON/картинки). Создаётся: wrangler r2 bucket create bridge42worlds-site
[[r2_buckets]]
binding = "SITE"
bucket_name = "bridge42worlds-site"

# Токены доступа к боту-тьютору (/api/tutor). Привязан 2026-07-29 — с этого момента гейт по токену
# в проде РАБОТАЕТ (без KV код молча пропускал всех, см. checkToken в worker.js).
# ⚠️ binding именно TOKENS (так обращается worker.js), namespace создавался с титулом TUTOR_TOKENS.
[[kv_namespaces]]
binding = "TOKENS"
id = "bf89cc7963304948a6a7aeeb0a06e43d"

# по понедельникам дополнительно отметка «я жив», иначе тишину не отличить от поломки.

# Смысловой поиск (/api/search): индекс строит cloudflare/vector_build.py.
# Один вектор на статью — четыре языка не влезли бы в бесплатные 5 млн измерений,
# а модель bge-m3 всё равно кросс-язычная. Привязано 2026-07-29.
[[vectorize]]
binding = "VECTORIZE"
index_name = "b42-articles"

# Модель эмбеддингов для запроса читателя (сам корпус считается скриптом заранее).
[ai]
binding = "AI"

# Секреты (НЕ в этом файле, они шифруются на стороне Cloudflare):
#   wrangler secret put DEEPSEEK_API_KEY     — ключ DeepSeek для бота
#   wrangler secret put ADMIN_KEY            — им выдаются токены через POST /api/tutor/issue
# Выдать токен на неделю:
#   curl -X POST https://<worker>/api/tutor/issue -H "x-admin-key: <ADMIN_KEY>" \
#        -H "content-type: application/json" -d '{"days":7,"limitTotal":200,"limitDay":50,"note":"демо"}'

[observability]
enabled = true
