<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что мы предлагаем исследовать — bridge42worlds</title>
<meta name="description" content="Направления исследований с планом работы: куда смотреть, как делать, какие работы прочесть. Каждое опирается на разобранные нами статьи arXiv.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=860f0df172">
<style>
  /* Страница устроена как остальные справочные (hypotheses/frontier/discoveries): одна на все
     языки, содержимое фетчем из data/theory/research.json. Своё устройство рядом с общим
     заводить нельзя — это уже дважды кончалось переделкой.

     Карточка направления повторяет то, о чём просил владелец, в его же порядке: вопрос →
     почему предлагаем (замер поля) → как делать → что прочесть. Замер стоит ВЫШЕ плана
     сознательно: сначала основание, потом предложение, иначе это просто чужое мнение. */
  .top-bar{display:flex;justify-content:space-between;align-items:center;
    max-width:var(--col-wide, 1100px);margin:0 auto 18px;padding:16px 16px 0}
  .logo{font-family:var(--font-display);font-size:15px;color:var(--soft);text-decoration:none}
  .logo:hover{color:var(--accent)}
  .theme-toggle{background:none;border:1px solid var(--line, var(--hair));color:var(--soft);
    border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px}

  .r-wrap{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 60px}
  .r-head h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin-bottom:8px}
  .r-sub{color:var(--soft);font-size:15px;margin-bottom:14px}
  .r-lead{max-width:70ch;font-size:15px;line-height:1.72}
  /* Оговорка на видном месте, а не в подвале: это предложение, а не результат. */
  .r-honest{max-width:70ch;margin-top:14px;padding:12px 15px;border-radius:11px;
    background:var(--tag-bg, var(--surface));border:1px solid var(--line, var(--hair));
    font-size:13.5px;line-height:1.65;color:var(--muted)}

  .r-list{display:grid;gap:16px;margin-top:26px}
  .r-card{border:1px solid var(--line, var(--hair));border-radius:14px;background:var(--surface);
    padding:20px 22px}
  .r-q{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.35;
    margin-bottom:12px}
  .r-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .r-tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:4px 10px;
    border-radius:14px;border:1px solid var(--line, var(--hair));color:var(--soft)}
  .r-tag.scale{border-color:color-mix(in srgb, var(--ochre) 40%, var(--hair));color:var(--ochre)}
  .r-sec{margin-top:14px}
  .r-sec b{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.14em;color:var(--soft);margin-bottom:6px}
  .r-sec p{font-size:14.5px;line-height:1.7}
  .r-drill{margin-top:14px;padding:13px 15px;border-radius:11px;
    background:var(--tag-bg, var(--bg));border:1px solid var(--line, var(--hair))}
  .r-drill .r-num{font-family:var(--mono);font-size:13px;color:var(--text)}
  .r-drill .r-num i{font-style:normal;color:var(--soft)}
  .r-reads{margin-top:6px;display:grid;gap:7px}
  .r-read{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;font-size:14px}
  .r-read a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
  .r-read a:hover{color:var(--link);border-bottom-color:var(--link)}
  .r-read .r-mark{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
  .r-src{margin-top:16px;padding-top:13px;border-top:1px solid var(--line, var(--hair));
    font-size:13px;color:var(--soft)}
  .r-src a{color:var(--link);text-decoration:none}
  /* Точки схождения — другой сорт материала, и это должно быть видно глазом, а не
     только из подписи: отбиты чертой, карточка спокойнее, без охряной метки масштаба. */
  .r-points{margin-top:44px;padding-top:26px;border-top:1px solid var(--line, var(--hair))}
  .r-points h2{font-family:var(--font-display);font-size:clamp(21px,3.2vw,27px);
    line-height:1.2;margin-bottom:8px}
  .r-points .r-lead{margin-bottom:0}
  .r-card-pt{background:var(--tag-bg, var(--bg))}
  .r-card-pt .r-sec p{font-size:14px;line-height:1.65;color:var(--muted);margin-top:6px}
  .r-empty{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:640px){ .r-card{padding:16px 15px} .r-read{gap:5px} }
</style>
<script>
(function () {
  var allowed = ['ru', 'en', 'es', 'ar', 'fr'];
  var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  var saved = null;
  try { saved = localStorage.getItem('b42_lang'); } catch (e) {}
  var lang = allowed.indexOf(q) >= 0 ? q : (allowed.indexOf(saved) >= 0 ? saved : 'ru');
  window.B42_LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  try { localStorage.setItem('b42_lang', lang); } catch (e) {}
})();
</script>
</head>
<body>

<div class="top-bar">
  <a href="/learn.html" class="logo">bridge42worlds</a>
  <button type="button" class="theme-toggle" onclick="var h=document.documentElement;h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');">◐</button>
</div>

<div class="r-wrap">
  <div class="r-head">
    <h1 id="h"></h1>
    <div class="r-sub" id="sub"></div>
    <p class="r-lead" id="lead"></p>
    <div class="r-honest" id="honest"></div>
  </div>
  <div id="root"></div>
</div>

<script>
(function () {
  var LANG = window.B42_LANG || 'ru';
  var root = document.getElementById('root');

  var UI = {
    ru: { plan: 'Как делать', reads: 'Что прочесть', skills: 'Что нужно уметь',
          why: 'Почему сейчас', drill: 'Почему мы это предлагаем',
          world: 'работ в arXiv вплотную к теме', ours: 'из них разобрано нами',
          near: 'ближайшая по смыслу', src: 'Выросло из разбора', full: 'полный разбор',
          express: 'экспресс' },
    en: { plan: 'How to do it', reads: 'What to read', skills: 'What you need',
          why: 'Why now', drill: 'Why we suggest this',
          world: 'arXiv papers right next to the topic', ours: 'of them reviewed by us',
          near: 'closest by meaning', src: 'Grew out of our review of', full: 'full review',
          express: 'express' },
    es: { plan: 'Cómo hacerlo', reads: 'Qué leer', skills: 'Qué hace falta',
          why: 'Por qué ahora', drill: 'Por qué lo proponemos',
          world: 'trabajos de arXiv junto al tema', ours: 'de ellos analizados por nosotros',
          near: 'el más cercano por significado', src: 'Surgió del análisis de',
          full: 'análisis completo', express: 'exprés' },
    fr: { plan: 'Comment faire', reads: 'Que lire', skills: 'Ce qu’il faut',
          why: 'Pourquoi maintenant', drill: 'Pourquoi nous le proposons',
          world: 'travaux arXiv juste à côté du sujet', ours: 'dont analysés par nous',
          near: 'le plus proche par le sens', src: 'Né de notre analyse de',
          full: 'analyse complète', express: 'express' },
    ar: { plan: 'كيف يُنفَّذ', reads: 'ماذا تقرأ', skills: 'ما يلزم',
          world: 'أعمال في arXiv ملاصقة للموضوع', ours: 'منها حلّلناها نحن',
          why: 'لماذا الآن', drill: 'لماذا نقترح هذا',
          near: 'الأقرب من حيث المعنى', src: 'نشأ من تحليلنا لـ', full: 'تحليل كامل',
          express: 'سريع' }
  }[LANG] || null;

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }

  fetch('/data/theory/research.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var T = (d.page && (d.page[LANG] || d.page.ru)) || {};
      var W = UI || {};
      document.title = (T.title || 'Что исследовать') + ' — bridge42worlds';
      document.getElementById('h').textContent = T.title || '';
      document.getElementById('sub').textContent = T.subtitle || '';
      document.getElementById('lead').textContent = T.lead || '';
      document.getElementById('honest').textContent = T.honest || '';

      var items = d.items || [];
      if (!items.length) { root.appendChild(el('div', 'r-empty', '—')); return; }

      var list = el('div', 'r-list');
      items.forEach(function (it) {
        // Тексты карточки: на своём языке, с откатом на русский оригинал.
        var L = (it.lang && it.lang[LANG]) || it;
        var c = el('div', 'r-card');
        c.appendChild(el('div', 'r-q', esc(L.question || it.question)));

        var meta = el('div', 'r-meta');
        if (L.scale || it.scale) meta.appendChild(el('span', 'r-tag scale', esc(L.scale || it.scale)));
        if (it.date) meta.appendChild(el('span', 'r-tag', esc(it.date)));
        c.appendChild(meta);

        // ПОЧЕМУ предлагаем — числа замера, а не слова. Владелец: «мы пробурили вектором,
        // и вот ссылки почему».
        var w = it.world || {}, a = it.archive || {};
        if (w.near != null || a.nearest) {
          var dr = el('div', 'r-drill');
          dr.appendChild(el('b', null, esc(W.drill || '')));
          var num = el('div', 'r-num');
          var bits = [];
          if (w.near != null) bits.push('<b>' + w.near + '</b> <i>' + esc(W.world) + '</i>');
          if (w.ours != null) bits.push('<b>' + w.ours + '</b> <i>' + esc(W.ours) + '</i>');
          if (a.nearest) bits.push('<b>' + a.nearest.toFixed(2) + '</b> <i>' + esc(W.near) + '</i>');
          num.innerHTML = bits.join(' · ');
          dr.appendChild(num);
          if (L.why_now || it.why_now) {
            dr.appendChild(el('p', null, esc(L.why_now || it.why_now)));
          }
          c.appendChild(dr);
        }

        var plan = el('div', 'r-sec');
        plan.appendChild(el('b', null, esc(W.plan || '')));
        plan.appendChild(el('p', null, esc(L.plan || it.plan)));
        c.appendChild(plan);

        if (L.skills || it.skills) {
          var sk = el('div', 'r-sec');
          sk.appendChild(el('b', null, esc(W.skills || '')));
          sk.appendChild(el('p', null, esc(L.skills || it.skills)));
          c.appendChild(sk);
        }

        if ((it.reads || []).length) {
          var rd = el('div', 'r-sec');
          rd.appendChild(el('b', null, esc(W.reads || '')));
          var box = el('div', 'r-reads');
          it.reads.forEach(function (r) {
            var t = (r.titles && (r.titles[LANG] || r.titles.ru)) || r.id;
            var href = '/lang/' + LANG + '/archive/' + r.date + '/' + r.id + '/' +
                       (r.full ? 'advanced.html' : 'index.html');
            var line = el('div', 'r-read');
            line.innerHTML = '<a href="' + esc(href) + '">' + esc(t) + '</a>' +
              '<span class="r-mark">' + esc(r.full ? W.full : W.express) + '</span>' +
              '<span class="r-mark">arXiv:' + esc(r.id) + '</span>';
            box.appendChild(line);
          });
          rd.appendChild(box);
          c.appendChild(rd);
        }

        if (it.source) {
          var s = el('div', 'r-src');
          var sh = '/lang/' + LANG + '/archive/' + it.source.date + '/' + it.source.id + '/advanced.html';
          s.innerHTML = esc(W.src || '') + ' <a href="' + esc(sh) + '">' +
                        esc(it.source.title || it.source.id) + '</a>';
          c.appendChild(s);
        }
        list.appendChild(c);
      });
      root.appendChild(list);

      // Точки схождения. Отдельным блоком и другим тоном: направления выше — это работа,
      // за которую можно взяться, а здесь наблюдение о нашей же работе. Смешивать нельзя,
      // иначе читатель решит, что мы предсказали неизведанное.
      var pts = d.points || {};
      var PT = (pts.page && (pts.page[LANG] || pts.page.ru)) || null;
      if (PT && (pts.items || []).length) {
        var sec = el('div', 'r-points');
        sec.appendChild(el('h2', null, esc(PT.title)));
        sec.appendChild(el('p', 'r-lead', esc(PT.lead)));
        sec.appendChild(el('div', 'r-honest', esc(PT.note)));
        var box = el('div', 'r-list');
        pts.items.forEach(function (it) {
          var c = el('div', 'r-card r-card-pt');
          var names = (it.sources || []).map(function (s) {
            var t = (s.titles && (s.titles[LANG] || s.titles.ru)) || s.id;
            var href = '/lang/' + LANG + '/archive/' + s.date + '/' + s.id + '/' +
                       (s.full ? 'advanced.html' : 'index.html');
            return '<a href="' + esc(href) + '">' + esc(t) + '</a>';
          });
          c.innerHTML = '<div class="r-sec"><b>' + esc(PT.src) + '</b>' +
                        '<div class="r-reads">' + names.map(function (n) {
                          return '<div class="r-read">' + n + '</div>'; }).join('') + '</div></div>';
          var box2 = el('div', 'r-sec');
          box2.innerHTML = '<b>' + esc((PT.title || '')) + '</b>';
          (it.directions || []).forEach(function (x) {
            box2.appendChild(el('p', null, esc(x)));
          });
          c.appendChild(box2);
          box.appendChild(c);
        });
        sec.appendChild(box);
        root.appendChild(sec);
      }
    })
    .catch(function (e) { root.appendChild(el('div', 'r-empty', String(e))); });
})();
</script>
<script src="/js/course-i18n.js?v=37e49bc0b4"></script>
<script src="/js/sitenav.js?v=ae42fac0f2"></script>
<script src="/js/beta-banner.js?v=a16e674fd1" defer></script>
</body>
</html>
