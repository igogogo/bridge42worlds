<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>bridge42worlds</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/style.css?v=9d98a60453">
<script>
// Авторы теперь только на английском (одна версия, показывается на всех языках). Любой заход на
// /lang/{ru,es,ar,zh,fr}/authors/... тихо ведём на /lang/en/authors/... — исключаем en, чтобы
// реально отсутствующая en-страница не зациклила редирект.
(function () {
  var p = window.location.pathname;
  var m = p.match(/^\/lang\/(?!en\/)[a-z]{2}\/authors\/(.*)$/);
  if (m) { window.location.replace('/lang/en/authors/' + m[1] + window.location.search); }
})();
</script>
</head>
