<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El Niño 2026–2027 — bridge42worlds</title>
<meta name="description" content="Is El Niño under way, how strong is it against history, where is it heading, are the forecast models keeping up, and what does it mean for food. One panel, recomputed from NOAA, OISST, ERA5, IRI and FAO data.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=93ed6fa4e3">
<style>
  /* ПАНЕЛЬ, А НЕ СТРАНИЦА (владелец 03.09: «одностраничный, без прокруток, это панель, на
     ней всё должно быть динамическое»), с правками второго разбора:

       · строка «обновлено / докуда ряды / источники» — НАВЕРХУ, у каждого источника своё
         пояснение по наведению;
       · подвал объяснений НЕПОДВИЖЕН: фиксированная высота в три строки, чтобы он не дёргал
         раскладку при наведении, а рядом с курсором висит карточка-абзац;
       · левый борт — карточки: состояние, тревоги по климату, по ценам и по моделям,
         разбор «как ломаются модели», вердикт;
       · переключатель «сейчас / что изменилось с прошлого измерения» в шапке — числа
         показываются либо значением, либо дельтой;
       · графики рисуются под размер окна и перерисовываются при изменении размера и темы.

     Цвета события отдельно от акцента сайта: охра — интерфейс, красный «Ниньо» и синий
     «Нинья» и пять уровней риска — семантика данных. */
  :root{
    --nino:#A8432B; --nina:#4A6FA5; --ok:#4A7C59;
    --lv5:#7A1F1F; --lv4:#A8432B; --lv3:#C9843A; --lv2:#8F8A81; --lv1:#B9B4AB;
    --band:#B9B4AB; --grid:color-mix(in srgb, var(--ink) 12%, transparent);
    --a1982:#7D5B8F; --a1997:#B06A8F; --a2015:#C07B53; --a2023:#D08A2B;
    /* прошлый год — не событие, поэтому нейтральный серый, а не цвет аналога */
    --a2025:#8A8F98; --a2024:#8A8F98;
    --rail:286px; --rail2:310px; --dockh:34px;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){ --nino:#E58973; --nina:#8FB1DE; --ok:#8FBE9B; --band:#5c5a55;
      /* УРОВНИ РИСКА В ТЁМНОЙ ТЕМЕ. Их здесь не было: --lv3/--lv4/--lv5 оставались светлыми
         значениями (тёмно-бордовый #7A1F1F), а ими пишется текст — цифра индекса риска,
         имена сломанных моделей в мозаике, подписи зон на карте Тихого океана, строка
         исчерпанного запаса. Контраст выходил 1,4:1 на тёмном фоне, то есть текст исчезал
         ровно тогда, когда он важнее всего (владелец 09.09: «в тёмной теме текст не читаем»).
         Здесь те же цвета, поднятые до читаемых на #1b1f27 и на карточке #2f3542.
         --soft и --muted тоже подняты: на подложке карточек они давали 3,98 и 4,20. */
      --lv5:#E06B6B; --lv4:#E08A5C; --lv3:#E0A860; --lv2:#8b8880; --lv1:#63615c;
      --soft:#9AA3B4; --muted:#A2A9B8; --a1982:#A98BBB; --a1997:#D39BB9; --a2015:#E0A07E; --a2023:#E8B45C;
      --a2025:#9AA0AA; --a2024:#9AA0AA; }
  }
  html[data-theme="dark"]{ --nino:#E58973; --nina:#8FB1DE; --ok:#8FBE9B; --band:#5c5a55;
      --lv5:#E06B6B; --lv4:#E08A5C; --lv3:#E0A860; --lv2:#8b8880; --lv1:#63615c;
      --soft:#9AA3B4; --muted:#A2A9B8; --a1982:#A98BBB; --a1997:#D39BB9; --a2015:#E0A07E; --a2023:#E8B45C;
      --a2025:#9AA0AA; --a2024:#9AA0AA; }

  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  /* Общий стиль сайта держит body в читательской колонке (max-width 700px) — панели нужен
     весь экран, иначе середина схлопывается в 60 пикселей. */
  body{background:var(--bg);color:var(--text);max-width:none;width:100%;margin:0;padding:0}
  .langs-row,.nav-live{display:none !important}

  /* Строки сетки: шапка, сцена, подвал, строка обновлений. Когда строка обновлений уехала
     из шапки вниз, порядок строк остался прежним — и она попала в неявную пятую строку,
     налезая на подвал. Описываем ровно те четыре, что есть. */
  /* Строки назначаем ПОИМЕННО, а не по порядку детей: sitenav.js вставляет в панель свой
     пустой ряд языков, он забирал строку сетки, и строка обновлений уезжала в неявную
     пятую — поверх подвала. Теперь у каждого своя строка, и чужая вставка ничего не
     сдвигает. */
  /* Строка подвала — auto, а не фиксированная: подвал теперь несёт две строки (подсказку
     и обновления), и жёсткая высота обрезала вторую. Неподвижность подвала держится не
     высотой строки сетки, а его собственным min-height и обрезкой текста в три строки —
     то есть он по-прежнему не прыгает при смене подсказки. */
  /* КОЛОНКА, А НЕ СЕТКА ИЗ ЧЕТЫРЁХ СТРОК. Сетка требовала, чтобы детей было ровно столько,
     сколько строк, — а sitenav.js добавляет в панель свой ряд, и строки разъезжались: под
     сценой оставалось сорок пикселей пустоты, которых никто не просил (владелец 04.09:
     «поле где графики фиксированной высоты, можно же сделать больше, прям до нижней
     строчки, а то на ноуте много пустого места»). Колонке всё равно, сколько детей:
     шапка и подвал занимают своё, сцена забирает ВСЁ остальное до самого низа. */
  .panel{display:flex;flex-direction:column;height:100dvh;gap:7px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box}
  .panel > .mid{flex:1 1 auto;min-height:0}
  .panel > .top-bar,.panel > .dock,.panel > .langs-row{flex:0 0 auto}

  /* ── шапка ────────────────────────────────────────────────────────────────── */
  /* justify-content:flex-start — против общего стиля сайта, где шапка распределяет элементы
     поровну (там это нужно, чтобы гамбургер не висел посреди). Пока ряд вкладок занимал всю
     свободную ширину, это не было видно; стоило вкладкам уехать на свою строку — логотип,
     гамбургер, ночной режим и заголовок разъехались по всей ширине. */
  /* Отступ слева тот же, что у текста внутри карточек (плитка + её padding), — тогда
     логотип, вкладки и слово STATE стоят на одной вертикали, а не вразнобой
     (владелец 04.09: «всё должно быть выровнено по рамке, где state»). */
  .top-bar{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 0 0 23px;margin:0;
    max-width:none;min-width:0;flex-wrap:wrap;row-gap:5px;height:auto;min-height:32px;flex-shrink:0}
  .logo{font-family:var(--font-display);font-size:14px;color:var(--soft);text-decoration:none;white-space:nowrap}
  .logo:hover{color:var(--accent)}
  .p-title{font-family:var(--font-display);font-size:clamp(13px,1.4vw,15px);font-weight:600;white-space:nowrap}
  .p-title b{color:var(--nino);font-weight:600}
  .theme-toggle{background:none;border:1px solid var(--line, var(--hair));color:var(--soft);
    border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:12px;flex-shrink:0}
  /* ВКЛАДКИ — ВСЕГДА ОТДЕЛЬНОЙ СТРОКОЙ, И БЕЗ ПРОКРУТКИ. Владелец 04.09: «верхнее меню тоже
     надо пониже отдельной строкой, где state, risk и так далее, чтобы без прокруток или в две
     строки». В одной строке с логотипом, гамбургером, ночным режимом и заголовком девяти
     кнопкам места не остаётся ни на каком экране: они уезжали вбок, и половину меню было не
     достать. Теперь шапка переносится, вкладки идут во всю ширину под ней и при нехватке
     места переходят на вторую строку — прокрутки нет нигде. */
  /* Вкладки начинаются там же, где основное поле со сценой: слева от него — колонка
     состояния, и меню, начинающееся от её края, читалось как её часть (владелец 04.09:
     «раз меню переехало на свою строку, пусть начинается не от state, а от поля основного
     с графиками»). Отступ считается из ширины колонки, поэтому меняется вместе с ней. */
  /* Ширина строки — 100 % МИНУС отступ слева: иначе с ростом числа вкладок строка не
     переносилась, а уезжала за правый край (владелец 05.09, четырнадцать вкладок). */
  /* Меню стало большим — выравниваем влево, по оси названия вверху (владелец 05.09). */
  .tabs{display:flex;flex-direction:column;align-items:stretch;gap:4px;row-gap:4px;overflow:visible;min-width:0;
    /* два ряда: основные пункты влево, служебные вправо (владелец 07.09) */
    flex:0 0 100%;order:9;margin-inline-start:0;
    padding-bottom:3px}
  /* значок «i» с подсказкой у пунктов меню и подменю */
  .ti{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;
    border:1px solid currentColor;font:italic 600 8.5px/1 Georgia,serif;padding:0 0 1px 0;box-sizing:border-box;margin-inline-start:6px;opacity:.55;
    cursor:help;vertical-align:1px}
  .ti:hover{opacity:1}
  .tab.on .ti,.seg button.on .ti{opacity:.85}
  @media (max-width:560px){ .tab .ti{display:none} }   /* на телефоне меню и так в пять строк */   /* отбивка от рамки сцены: меню не должно лежать на ней */
  /* свёрнутое меню телефона: видна одна строка — где мы сейчас (владелец 09.09) */
  .tabs.mob.closed .trow:not(.tog){display:none}
  .tabs .trow.tog{display:flex}
  .tab.navtog{font-weight:600;letter-spacing:.02em}
  .tabs.mob.open .trow:not(.tog){padding-bottom:2px}
  /* ЗНАЧКИ УРОВНЯ. Подложка значка — цвет уровня; в тёмной теме уровни стали светлее, и
     белая цифра по ним даёт 2,6-3,1:1. Пишем по светлым уровням тёмными чернилами, а по
     тёмным (в светлой теме) остаётся белый. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .risk .rl,
    :root:not([data-theme="light"]) .lvl,
    :root:not([data-theme="light"]) .cls.ok,
    :root:not([data-theme="light"]) .cls.lag,
    :root:not([data-theme="light"]) .br-l{color:#151a22}
  }
  [data-theme="dark"] .risk .rl,[data-theme="dark"] .lvl,
  [data-theme="dark"] .cls.ok,[data-theme="dark"] .cls.lag,[data-theme="dark"] .br-l{color:#151a22}
  .g-side b .dsub{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--soft);letter-spacing:.04em;margin-top:1px}
  /* рекорд в ленте KPI: красная рамка, мягко дышит, и метка (владелец 10.09) */
  .ks.rec{border-color:var(--lv5);position:relative;animation:b42-recpulse 2.6s ease-in-out infinite}
  .ks.rec .ks-v{color:var(--lv5)}
  /* метка стоит ВНУТРИ плитки: полоса прокручивается и обрезает всё, что выше её края */
  .ks-rec{position:absolute;top:2px;inset-inline-end:5px;font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--surface);background:var(--lv5);border-radius:3px;padding:0 4px;line-height:11px}
  .ks.rec{padding-top:9px}
  @keyframes b42-recpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--lv5) 55%, transparent)}60%{box-shadow:0 0 0 6px transparent}}
  @media (prefers-reduced-motion: reduce){ .ks.rec{animation:none} }
  .jnote{margin:4px 0 2px;padding:4px 7px;border-inline-start:2px solid var(--cyan);background:color-mix(in srgb, var(--cyan) 7%, transparent);
    border-radius:0 6px 6px 0;font-size:11px;line-height:1.4;color:var(--muted)}
  .tabs::-webkit-scrollbar{display:none}
  /* Чётче: цвет основного текста вместо приглушённого и чуть плотнее начертание —
     меню должно читаться с первого взгляда (владелец 04.09). */
  .tabs .trow{display:flex;gap:4px;flex-wrap:wrap;row-gap:4px;min-width:0}
  .tabs .trow.svc{justify-content:flex-end}
  @media (max-width:900px){ .tabs .trow.svc{justify-content:flex-start} }
  /* 8. дата — коротким жирным моноширинным, одинаково везде (владелец 07.09) */
  .dt{font-family:var(--mono);font-size:.94em;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .tab{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--text);font-weight:500;background:none;
    border:1px solid var(--line, var(--hair));border-radius:999px;padding:5px 12px;
    cursor:pointer;white-space:nowrap;transition:color .15s,background .15s,border-color .15s}
  .tab:hover{color:var(--ochre)}
  /* Выбранное — заливкой, как вердикт (владелец 05.09): «если выбран — такой же вид, как
     подсветка verdict»; сам вердикт — контрастно чёрно-белый, при выборе наоборот; служебные
     (метод, цепочка, о панели) — пунктирная рамка и приглушённый цвет. */
  .tab.on{color:var(--surface);border-color:var(--ochre);background:var(--ochre);font-weight:600}
  .tab.svc{border-style:dashed;color:var(--soft)}
  .tab.svc:hover{color:var(--text)}
  .tab.svc.on{background:var(--soft);border-color:var(--soft);border-style:solid;color:var(--surface)}
  /* Вердикт — не такая вкладка, как остальные: это ответ на вопрос «ну и что?», и он должен
     бросаться в глаза первым (владелец 04.09: «ссылку на вердикт отдельным пунктом и поярче,
     может инверсно»). Инверсия: заливка цветом события, текст на ней светлый. */
  .tab.verdict{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;
    margin-inline-end:8px}
  .tab.verdict:hover{background:var(--text);color:var(--bg)}
  .tab.verdict.on{background:var(--bg);border-color:var(--ink);color:var(--ink)}
  /* Кнопки «сейчас / что изменилось» больше нет: сравнение переехало на кирпичи. */

  /* ── строка обновления и источников (наверху, а не в подвале) ─────────────── */
  /* Строка обновлений живёт в шапке справа: прижата авто-отступом, в одну строку,
     при нехватке места прокручивается вбок, а не ломает шапку. */
  .p-meta{display:flex;align-items:center;gap:4px 14px;flex-wrap:nowrap;font-family:var(--mono);
    margin-inline-start:auto;justify-content:flex-end;min-width:0;max-width:62%;
    overflow-x:auto;scrollbar-width:none;
    /* Отступ справа задаём ПОСЛЕ короткой записи padding: иначе она его затирала и строка
       «updated Sep 7» липла к самому краю окна (владелец 07.09). */
    font-size:10.5px;color:var(--soft);padding:0 2px;padding-inline-end:20px;min-height:16px}
  .p-meta > span{white-space:nowrap}
  .p-meta b{font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-size:9.5px}
  .p-meta i{font-style:normal;opacity:.75}
  .p-meta .bad, .p-meta .bad b{color:var(--nino)}
  .p-meta::-webkit-scrollbar{display:none}

  /* ── средняя часть ───────────────────────────────────────────────────────── */
  .mid{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--rail2);gap:8px;min-height:0}
  .col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  .tile{border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--surface);
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .tile > .th{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:8px 12px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--soft);flex-shrink:0}
  .tile > .th .rt{letter-spacing:0;text-transform:none;font-size:11px}
  /* рельсы во весь экран (владелец 07.09): кнопка в шапке плитки; класс на .mid прячет остальные колонки, меню остаётся */
  .tile{position:relative}
  .rail-full{position:absolute;top:5px;right:8px;font-family:var(--mono);font-size:11px;line-height:1;padding:2px 6px;border-radius:6px;border:1px solid var(--hair);background:var(--surface);color:var(--soft);cursor:pointer}
  .tile > .th{padding-right:36px}
  .rail-full:hover{color:var(--ochre);border-color:var(--ochre)}
  .mid.rf-L{grid-template-columns:minmax(0,1fr)} .mid.rf-L #stage,.mid.rf-L #railR{display:none}
  .mid.rf-R{grid-template-columns:minmax(0,1fr)} .mid.rf-R #stage,.mid.rf-R #railL{display:none}
  .mid.rf-L .col.rail,.mid.rf-R .col.rail{display:flex}
  .mid.rf-L #railL .tb,.mid.rf-R #railR .tb > div{column-count:3;column-gap:14px}
  .mid.rf-L #railL .tb > *,.mid.rf-R .risk{break-inside:avoid}
  @media (max-width:1200px){.mid.rf-L #railL .tb,.mid.rf-R #railR .tb > div{column-count:2}}
  .tile > .tb{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;scrollbar-width:thin}
  .tile > .tb.flush{padding:0}
  .tile.grow{flex:1}

  /* ── карточки левого борта ───────────────────────────────────────────────── */
  .cards{display:flex;flex-direction:column;gap:7px}
  .card{border:1px solid var(--line, var(--hair));border-radius:10px;padding:9px 11px;
    background:var(--tag-bg, transparent)}
  .card .ch{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-family:var(--mono);font-size:9px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .card .ch b{padding:1px 5px;border-radius:3px;color:#fff;font-weight:600;background:var(--lv2)}
  .card .ch .kk{opacity:.8}
  .card .ch .new{margin-inline-start:auto;color:var(--ochre);border:1px solid color-mix(in srgb, var(--ochre) 45%, var(--hair));
    border-radius:999px;padding:0 5px}
  .card .ct{font-size:13px;font-weight:600;line-height:1.35}
  .card .cd{font-size:12px;line-height:1.5;color:var(--muted);margin-top:3px}
  .card .cd.chronic b{color:var(--text);font-weight:600}
  .alert-card.lv-shout{border-color:var(--lv5);background:color-mix(in srgb, var(--lv5) 9%, transparent)}
  .alert-card.lv-shout .ch b{background:var(--lv5)}
  .alert-card.lv-watch{border-color:color-mix(in srgb, var(--lv3) 55%, var(--hair));
    background:color-mix(in srgb, var(--lv3) 7%, transparent)}
  .alert-card.lv-watch .ch b{background:var(--lv3)}
  .alert-card.kind-food .ch .kk{color:var(--lv3)}
  .alert-card.kind-models .ch .kk{color:var(--nina)}
  .card.quiet{border-color:color-mix(in srgb, var(--ok) 45%, var(--hair));background:color-mix(in srgb, var(--ok) 7%, transparent)}
  .models-card{cursor:pointer}
  .models-card:hover{border-color:color-mix(in srgb, var(--ochre) 50%, var(--hair))}
  .models-card .spark{margin-top:6px}
  .chgline{font-family:var(--mono);font-size:10px;color:var(--soft);margin-top:4px;display:block}
  /* Контекстные ссылки на разобранные работы: чип у якоря и полный список в сцене риска. */
  .lk{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;margin-inline-start:6px;
    padding:1px 6px;border-radius:999px;border:1px solid color-mix(in srgb, var(--cyan) 45%, var(--hair));
    color:var(--cyan);white-space:nowrap;text-decoration:none;vertical-align:1px}
  .links-box{border-top:1px solid var(--line, var(--hair));padding-top:8px;flex-shrink:0}
  .lk-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
  .lk-i{display:block;text-decoration:none;color:var(--text);padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--ink) 6%, transparent)}
  .lk-i:last-of-type{border-bottom:0}
  .lk-i b{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
  .lk-i:hover b{color:var(--cyan)}
  .lk-i span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
  .lk-i i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
  .lk-n{font-size:10.5px;color:var(--soft);line-height:1.45;margin-top:5px}
  .new{font-family:var(--mono);font-size:9px;color:var(--ochre)}

  /* Индекс риска — по центру сверху, текст под ним (владелец 04.09). Раньше круг стоял
     слева, а справа шла колонка мелких строк: цифра терялась, а мелкая подпись под шкалой
     не читалась вовсе — её убрали. */
  .gauge-row{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .gauge-row .g-side{width:100%}
  /* ПОСЛЕДНЯЯ ДЕСЯТАЯ ШКАЛЫ — ЗАПАС ЗА ПРЕДЕЛОМ ЗАПИСИ (владелец 10.09). Слоями снизу вверх:
     серый круг, слабая заливка сектора 90–100, само значение, чёрная засечка на 90. Девяносто
     процентов круга это 324°, потому засечка и стоит там. Отдельным элементом её не рисуем:
     на .gauge.hot уже висит ::after с пульсацией. */
  .gauge{--v:0;--c:var(--ok);width:74px;height:74px;border-radius:50%;position:relative;flex-shrink:0;
    background:
      conic-gradient(from 324deg, color-mix(in srgb, var(--text) 60%, transparent) 0 1.4deg, transparent 1.4deg),
      conic-gradient(var(--c) calc(var(--v)*1%), transparent 0),
      conic-gradient(transparent 0 90%, color-mix(in srgb, var(--lv5) 20%, transparent) 90% 100%),
      conic-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 0 100%);
    display:grid;place-items:center;cursor:help}
  .gauge::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
  .gauge .gv{position:relative;font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--c);line-height:1}
  /* Подпись шкалы больше не живёт внутри круга: там она не помещалась и обрезалась. */
  .g-side .glab{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);margin-bottom:3px}
  .g-side{font-size:12px;line-height:1.45;color:var(--muted);min-width:0}
  .g-side b{display:block;font-family:var(--font-display);font-size:14px;color:var(--text);line-height:1.25;margin-bottom:2px}
  .g-side .rscale{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--soft);line-height:1.4}

  .verdict .vv{font-family:var(--font-display);font-size:13.5px;line-height:1.4;margin:0 0 6px}
  .verdict .vv.on{color:var(--lv5)}
  .verdict dl{margin:0}
  .verdict dt{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--soft);margin-top:7px}
  .verdict dd{margin:1px 0 0;font-size:12px;line-height:1.45;color:var(--muted)}
  .verdict ul{margin:2px 0 0 15px;padding:0;font-size:12px;color:var(--muted)}

  /* ── сцена ───────────────────────────────────────────────────────────────── */
  .stage{display:flex;flex-direction:column;min-height:0;min-width:0}
  /* Заголовок сцены — своя строка, подменю всегда под ним: раньше подменю вставало рядом с
     коротким заголовком и прыгало вниз у длинного (владелец 07.09, Ocean). */
  .stage-head{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:5px 12px 4px;flex-shrink:0}
  .stage-top{display:flex;align-items:flex-start;gap:10px}
  /* строка управления (08.09): слева source/notes, справа back · globe · ⛶ */
  .stage-ctl{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-inline-start:auto}   /* кнопки в строке заголовка, у верхнего края (08.09) */
  .ctl-nav{margin-left:auto;display:flex;gap:6px;align-items:center}
  .ctl-nav .back-go.bright{margin-left:0}
  .ctl-info:empty{display:none}
  /* облако понятий (08.09): строка чипов внутри подсказок и ящиков, третьего окна нет */
  .cn{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px;padding-top:6px;border-top:1px solid var(--hair-soft, var(--hair))}
  .cn-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-inline-end:2px}
  .cn-c{display:inline-block;font-size:11px;line-height:1.3;padding:1px 8px;border:1px solid color-mix(in srgb, var(--cyan) 55%, transparent);border-radius:999px;color:var(--text);text-decoration:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cn-c[data-src],.cn-in[data-src]{text-decoration:none} .cn-in[data-src]{text-decoration:underline dotted color-mix(in srgb, var(--cyan) 70%, transparent)}
  .cn-c:hover{background:var(--cyan);color:var(--surface);border-color:var(--cyan)}
  .cn-c.more{border-style:dashed;color:var(--soft)}
  .cn-mg{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--cyan);background:transparent;border:1px solid color-mix(in srgb, var(--cyan) 55%, transparent);border-radius:999px;padding:0 8px;cursor:pointer;white-space:nowrap}
  .cn-mg:hover,.cn-mg.on{background:var(--cyan);color:var(--surface)}
  /* понятия колонкой в подсказке */
  .cn.col{display:block}
  .cn.col .cn-h{display:block;margin-bottom:3px}
  .cn-r{display:block;padding:3px 0;border-top:1px solid var(--hair-soft, var(--hair));text-decoration:none;color:var(--text)}
  .cn-r b{display:block;font-size:11.5px;font-weight:600;line-height:1.3;font-family:var(--font-body, inherit);padding:0;margin:0}
  .cn-r span{display:block;font-size:10.5px;color:var(--soft);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cn-r:hover b{color:var(--cyan)}
  .cn-f{display:flex;align-items:center;gap:8px;margin-top:5px} .cn-f .cn-mg{margin-inline-start:auto}
  .cn-more{font-family:var(--mono);font-size:10px;color:var(--soft)}
  /* кнопка graph на плитках и карточках: своё место, ни на что не наезжает (владелец 08.09) */
  .tile > .th .cn-mg.rail{position:absolute;top:5px;right:34px;margin:0;font-size:10px;padding:1px 7px;line-height:1.3}
  .tile > .th:has(.cn-mg.rail){padding-right:88px}
  .risk .rf .cn-mg.rail,.kj .jsrc .cn-mg.rail{position:absolute;inset-inline-end:86px;bottom:5px;margin:0;font-size:10px;padding:0 7px;line-height:1.5}
  .card .cn-mg.rail{margin:4px 0 0 6px;font-size:10px;padding:0 7px;vertical-align:middle}
  .cn-modal .cn{border-top:0;margin:0 0 6px;padding-top:0}
  /* лента главных KPI под вкладками (08.09) */
  .kstrip{display:flex;align-items:stretch;gap:6px;padding:4px 12px 6px 23px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
  .kstrip::-webkit-scrollbar{display:none}
  .ks-h{align-self:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--soft);cursor:default;text-decoration:none;margin-inline-end:2px}
  .ks{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-start;gap:3px;min-width:92px;padding:4px 10px 5px;border:1px solid var(--hair);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;text-align:left;font-family:inherit}
  .ks:hover{border-color:var(--ochre)}
  .ks-v{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
  .ks-v small{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-inline-start:3px}
  .ks-n{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);white-space:nowrap;line-height:1.3}
  .ks-row{display:flex;align-items:baseline;gap:6px}
  .ks-d{font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:1.3}
  .ks-d.up{color:var(--nino)} .ks-d.dn{color:var(--cyan)} .ks-d.same{color:var(--soft)}
  .jc{cursor:pointer} .jc:hover{text-decoration:underline}
  /* легенда строкой под шапкой сцены (08.09) */
  /* ЛЕГЕНДА РАЗВОРАЧИВАЕТСЯ СТОЛБИКОМ. Владелец 10.09: «было удобнее, когда легенда
     разворачивалась в столбик, а не в строку — в строке она теряется». Столбик читается
     сверху вниз, каждая строка на своём месте; на широком экране колонок несколько, чтобы
     длинный список не гнал сцену вниз. */
  .leg-bar{display:block;columns:2 220px;column-gap:22px;padding:2px 0 1px;font-family:var(--mono);font-size:10.5px;
    color:var(--muted);line-height:1.65;max-height:132px;overflow:auto}
  /* легенда отдельным окошком под кнопкой: сцена не прыгает, график не пересчитывается */
  .leg-pop{position:absolute;z-index:60;min-width:210px;max-width:min(560px,86vw);max-height:min(320px,52vh);
    columns:1;padding:7px 10px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);
    box-shadow:0 10px 26px rgba(0,0,0,.28)}
  @media (min-width:900px){ .leg-pop{columns:2 200px} }
  .stage-head{position:relative}
  .leg-bar .leg-c{display:flex;break-inside:avoid;width:100%}
  @media (max-width:760px){ .leg-bar{columns:1;max-height:150px} }
  .leg-c{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:4px;padding:0 3px}
  .leg-c svg{flex:none}
  .leg-c.pick{cursor:pointer} .leg-c.pick:hover{color:var(--text)}
  .leg-c.pick.on{color:var(--text);font-weight:600;background:color-mix(in srgb, var(--ochre) 16%, transparent)}
  .leg-sep{flex-basis:100%;height:0}
  /* исследование в диалоге (прототип 08.09): доска слева, диалог справа */
  .rs{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}
  .rs-board,.rs-chat{min-height:0;overflow:auto;border:1px solid var(--hair);border-radius:10px;padding:8px 10px;background:var(--surface)}
  .rs-chat{display:flex;flex-direction:column}
  .rs-log{flex:1;min-height:0;overflow:auto}
  .rs-m{margin:6px 0;padding:6px 9px;border-radius:9px;font-size:12.5px;line-height:1.45;position:relative}
  .rs-m p{margin:0 0 4px} .rs-m ul{margin:2px 0 0;padding-left:16px} .rs-m li{margin:2px 0}
  .rs-m.q{background:color-mix(in srgb, var(--ochre) 12%, transparent);margin-inline-start:14%}
  .rs-m.a{background:color-mix(in srgb, var(--cyan) 8%, transparent);margin-inline-end:8%}
  .rs-m .rs-t{position:absolute;top:4px;inset-inline-end:8px;font-family:var(--mono);font-size:9px;color:var(--soft)}
  .rs-m .demo{font-family:var(--mono);font-size:9.5px;color:var(--soft);display:block;margin-top:4px}
  .rs-m a{color:var(--cyan);text-decoration:none}
  /* общий край панели на сутки: полоска и число, видно всем */
  .rs-day{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:help}
  .rs-daybar{display:inline-block;width:54px;height:5px;border-radius:3px;background:color-mix(in srgb, var(--text) 12%, transparent);overflow:hidden}
  .rs-daybar i{display:block;height:100%;background:var(--cyan)}
  .rs-day.warn .rs-daybar i{background:var(--lv3)} .rs-day.warn{color:var(--text)}
  .rs-day.out .rs-daybar i{background:var(--lv5)} .rs-day.out{color:var(--lv5)}
  .rs-hits{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  /* мини-дашборд ответа: плитки KPI, искры рисков, карточки статистики — из готовых визуалов панели */
  .rs-dash{margin:8px 0 2px;padding:8px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:7px}
  .rs-dk{display:flex;flex-wrap:wrap;gap:6px}
  .rs-ds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
  .rs-ds .br-sp{padding:5px 7px}
  .rs-dt{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .rs-dst{display:flex;flex-direction:column;gap:3px;padding:6px 8px;border:1px solid var(--hair);border-radius:9px;text-decoration:none;color:var(--text);background:color-mix(in srgb, var(--ochre) 6%, transparent)}
  .rs-dst:hover{border-color:var(--ochre)}
  .rs-dst-t{font-size:11.5px;font-weight:600}
  .rs-dst-k{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:10.5px;color:var(--muted)} .rs-dst-k b{color:var(--text);font-size:12px}
  .rs-dst-m{font-size:10.5px;color:var(--muted);line-height:1.35}
  .rs-dsc{display:flex;flex-wrap:wrap;gap:4px}
  .rs-dcap{font-family:var(--mono);font-size:9.5px;color:var(--soft)}
  /* карточка счёта: операция каталога, посчитанная в браузере по нашим рядам */
  .rs-calc{margin:8px 0 2px;padding:8px;border:1px solid var(--ochre);border-radius:10px;background:color-mix(in srgb, var(--ochre) 5%, transparent);display:flex;flex-direction:column;gap:6px}
  .rs-ct{font-size:12px;font-weight:600}
  .rs-ck{display:flex;flex-wrap:wrap;gap:6px}
  .rs-ck span{display:flex;flex-direction:column;min-width:104px;font-size:10px;color:var(--muted);font-family:var(--mono)}
  .rs-ck b{font-size:15px;color:var(--text);font-family:var(--mono)}
  .rs-ck i{font-style:normal;font-size:9.5px;color:var(--soft);line-height:1.3}
  .rs-cc svg{width:100%;height:auto;display:block}
  .rs-cm{font-size:10.5px;color:var(--muted);line-height:1.4}
  .rs-hit{font-size:10.5px;border:1px solid var(--hair);border-radius:999px;padding:0 7px;color:var(--muted)}
  .rs-hit b{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-inline-end:4px}
  .rs-in{display:flex;gap:6px;margin-top:6px;align-items:flex-end}
  .rs-in textarea{flex:1;min-height:40px;resize:vertical;font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--hair);border-radius:8px;background:var(--bg, var(--surface));color:var(--text)}
  .rs-btn{font-family:var(--mono);font-size:11px;padding:4px 11px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
  .rs-btn:hover{border-color:var(--ochre);color:var(--ochre)} .rs-btn[disabled]{opacity:.45;cursor:default}
  .rs-btn.main{color:var(--ochre);border-color:var(--ochre);font-weight:600}
  .rs-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:10px 0 4px} .rs-h:first-child{margin-top:0}
  .rs-kpis{display:flex;flex-wrap:wrap;gap:6px}
  .rs-links a{display:block;font-size:12px;text-decoration:none;color:var(--text);padding:2px 0} .rs-links a:hover{color:var(--cyan)}
  .rs-links a b{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-inline-end:6px}
  .rs-works .wk-p{margin:4px 0 0;font-size:12px;line-height:1.4} .rs-works .wk-p b{display:block;font-size:12px}
  .rs-sum ol{margin:0;padding-left:18px;font-size:12px;line-height:1.45}
  .rs-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .rs-saved .it{display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 0;border-top:1px solid var(--hair-soft, var(--hair))}
  .rs-saved .it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .rs-saved .it .m{font-family:var(--mono);font-size:9.5px;color:var(--soft)}
  .rs-empty{color:var(--soft);font-size:12px;line-height:1.4}
  .rs-quota{font-family:var(--mono);font-size:10px;color:var(--soft);margin-top:4px} .rs-quota a{color:var(--cyan);text-decoration:none}
  .rs-cite{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan);border:1px solid color-mix(in srgb, var(--cyan) 55%, transparent);border-radius:4px;padding:0 4px;margin:0 2px;text-decoration:none;vertical-align:1px}
  .rs-cite.wk{text-transform:none;color:var(--ochre);border-color:color-mix(in srgb, var(--ochre) 55%, transparent)}
  .rs-hit.on{border-color:var(--cyan);color:var(--text)} .rs-hit.wk.on{border-color:var(--ochre)} a.rs-hit{text-decoration:none}
  .rs-links a.cited{color:var(--text);font-weight:600} .rs-links a i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--cyan);margin-inline-start:4px}
  .rs-v{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:0 5px;margin-inline-start:6px;cursor:default}
  .rs-v.supported{color:var(--ok);border:1px solid var(--ok)} .rs-v.contradicted{color:var(--nino);border:1px solid var(--nino)} .rs-v.unknown{color:var(--soft);border:1px solid var(--hair)}
  .rs-note{font-family:var(--mono);font-size:10px;color:var(--soft);align-self:center}
  .rs .cn{border-top:0;margin-top:0;padding-top:0}
  @media (max-width:900px){ .rs{grid-template-columns:1fr} .rs-chat{order:-1;max-height:52vh} .rs-m.q{margin-inline-start:6%} }
  /* статистический слой за кнопкой stats (08.09) */
  .info-pane.stats{max-height:none}
  .st-note{font-family:var(--mono);font-size:9.5px;color:var(--soft);align-self:center;margin-inline-start:8px}
  .st-item{padding:8px 0 6px;border-top:1px solid var(--hair-soft, var(--hair))} .st-item:first-of-type{border-top:0}
  .st-t{font-family:var(--font-display);font-size:13px;font-weight:600;margin-bottom:6px}
  .st-kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))} .st-kpis .kpi .kv{font-size:18px} .st-kpis .kpi .km{font-size:11px}
  .st-m{font-size:11.5px;line-height:1.45;margin-top:6px} .st-m b{font-family:var(--font-display)}
  .st-cav{margin:4px 0 0;padding-inline-start:16px;color:var(--muted)} .st-cav li{margin:1px 0}
  .st-w{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:3px}
  .st-dig{margin:0;padding-left:0;list-style:none} .st-dig li{font-size:12px;line-height:1.45;padding:3px 0;border-top:1px solid var(--hair-soft, var(--hair))}

  /* брифинг — вход на панель (08.09) */

  .br-spl{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)} .br-spv{font-family:var(--font-display);font-size:13px;font-weight:700;text-align:right}
  .br-kpis{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .br-ul{margin:0;padding-left:0;list-style:none} .br-ul li{font-size:13px;line-height:1.5;margin:0 0 7px;max-width:76ch;position:relative} .br-ul.small li{font-size:12px;margin-bottom:3px}
  .br-l{display:inline-block;width:18px;height:18px;border-radius:5px;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-inline-end:2px;vertical-align:1px}

  /* карточка устойчивости системы в колонке рисков (09.09) */
  .risk.stab{border-style:dashed}
  .stab-k{display:flex;flex-wrap:wrap;gap:3px 8px;margin:4px 0 2px;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
  .stab-k span{border:1px solid var(--hair);border-radius:999px;padding:0 6px;text-decoration:none;cursor:default} .stab-k span b{color:var(--text)}
  .stab-k span.on{border-color:var(--nino);color:var(--nino)} .stab-k span.on b{color:var(--nino)}
  /* окно графа поверх панели */
  .cn-modal{position:fixed;inset:0;z-index:300;background:rgba(8,10,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .cn-modal-box{width:min(880px,96vw);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:10px 12px 8px}
  .cn-modal-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;position:relative;padding-inline-end:26px}
  .cn-modal-h b{font-family:var(--font-display);font-size:14px;white-space:nowrap}
  .cn-modal-n{font-size:11px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .cn-modal-h .x{position:absolute;top:-2px;inset-inline-end:0;background:none;border:0;cursor:pointer;font-size:18px;color:var(--soft)} .cn-modal-h .x:hover{color:var(--nino)}
  .cn-modal .b42mini{margin:0;border:1px solid var(--hair);border-radius:8px;background:var(--bg, var(--surface));overflow:hidden}
  .cn-modal .b42mini-note{display:none}
  .cn-modal-f{display:flex;align-items:center;gap:10px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--soft)}
  .cn-modal-f .cn-g{margin-inline-start:auto}
  .cn-g{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--cyan);text-decoration:none;white-space:nowrap}
  .cn-g:hover{text-decoration:underline}
  .tip .cn{margin-top:6px} .tip .cn-c{font-size:10.5px;padding:0 7px}
  .cn-in{color:inherit;text-decoration:underline dotted color-mix(in srgb, var(--cyan) 70%, transparent);text-underline-offset:3px}
  .cn-in:hover{color:var(--cyan)}

  .cn-sec{margin-top:10px} .cn-row{padding:6px 0;border-bottom:1px solid var(--hair-soft, var(--hair))}
  .cn-a{font-size:12.5px;font-weight:600;margin-bottom:2px} .cn-row .cn{border-top:0;margin-top:2px;padding-top:0}
  /* «?» на плашке KPI и абзац простыми словами */
  .kpi .kn,.ov-kpi .kn{display:flex;align-items:center;gap:6px}
  .kq{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1px solid var(--cyan);color:var(--cyan);background:transparent;font:600 10px/14px var(--mono);padding:0;cursor:pointer;flex-shrink:0;letter-spacing:0}
  .kq:hover,.kq.on{background:var(--cyan);color:var(--surface)}
  .kp{font-size:11.5px;line-height:1.45;color:var(--text);margin:5px 0 2px;padding:5px 8px;border-left:2px solid var(--cyan);background:color-mix(in srgb, var(--cyan) 8%, transparent);border-radius:0 6px 6px 0}
  .back-go.bright{margin-left:auto;color:var(--ochre);border-color:var(--ochre);font-weight:600;background:color-mix(in srgb, var(--ochre) 10%, var(--surface))}
  .back-go.bright:hover{background:var(--ochre);color:var(--surface)}
  /* независимые переключатели (метрика Ховмёллера, «all» у цен): прямоугольные и другого цвета, отдельно от списка */
  .seg button.sq{border-radius:5px;border-color:var(--cyan);color:var(--cyan)}
  .seg button.sq.on{background:var(--cyan);border-color:var(--cyan);color:var(--surface)}
  .seg-gap{width:10px;border-left:1px solid var(--hair);margin:2px 2px}
  .seg button.leg{display:inline-flex;align-items:center;gap:5px;border-radius:5px;border-color:var(--hair)} .seg button.leg.on{background:var(--surface);color:var(--text);border-color:var(--text);font-weight:600}
  /* сетка цен 4×3 без прокрутки (владелец 07.09): ячейки делят высоту сцены, график рисуется по их размеру */
  /* стандарт сцены (владелец 08.09): описание источника и разбор — за переключателями, работы — кнопкой справа внизу */
  .info-pane{font-size:11.5px;line-height:1.45;border:1px solid var(--hair);border-radius:8px;padding:8px 10px;color:var(--text);opacity:.92;max-height:38vh;overflow:auto;flex-shrink:0}
  /* окошко под своей кнопкой: сцена не съезжает, график не пересчитывается (владелец 10.09) */
  .info-pane.info-pop{position:absolute;z-index:60;min-width:240px;max-height:min(430px,58vh);
    background:var(--surface);opacity:1;box-shadow:0 12px 30px rgba(0,0,0,.28)}
  .info-pane.info-pop.stats{max-height:min(430px,58vh)}
  .works-foot{display:flex;justify-content:flex-end;gap:6px;flex-shrink:0;margin-top:2px}
  /* шар (пилот 08.09): контейнер вместо графика, подпись поверх */
  .globe-box{flex:1 1 60%;min-height:340px;position:relative;overflow:hidden;border-radius:10px;background:radial-gradient(circle at 50% 50%, #151a24 0, #0f1219 70%)}
  .globe-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);font-family:var(--mono);font-size:12px}
  .globe-legend{position:absolute;left:10px;bottom:8px;font-size:11px;color:#eee;background:rgba(20,24,32,.75);padding:5px 9px;border-radius:8px;max-width:70%;line-height:1.4}
  .globe-legend .gl-bar{display:inline-block;width:70px;height:8px;vertical-align:middle;margin:0 6px;border-radius:4px;background:linear-gradient(90deg,#6e96d2,#2b3446 50%,#e08a5c)}
  .back-go.bright.on{background:var(--ochre);color:var(--surface)}
  .pgrid.fit{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:6px;flex:1;min-height:0}
  .pcell{min-width:0;min-height:0;overflow:hidden}
  .pcell svg{width:100%;height:100%;display:block}
  @media (max-width:900px){.pgrid.fit{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(6,1fr)}}
  /* Заголовок сцены и переключатели: если заголовку остаётся меньше 320 пикселей, он
     уезжает на свою строку целиком — иначе он вставал колонкой в три-четыре этажа и съедал
     высоту графика (поймано на 1280×720). */
  /* в одну строку всегда: JS уменьшает кегль до влезания (владелец 07.09), чтобы подменю не прыгало */
  .stage-h{font-family:var(--font-display);font-size:clamp(12px,1.35vw,15px);font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
    min-width:0;flex:1 1 200px;padding-top:2px}   /* без text-wrap:balance: он снова разрешал перенос и ломал строку (07.09) */
  .seg{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}
  .seg.sub{padding:0 0 2px}
  /* ЯРУС МЕНЮ ВИДЕН ПО ФОРМЕ РАМКИ (владелец 10.09). Верхнее меню — круглая пилюля, как
     было. Подменю сцены — скруглённый прямоугольник. Подменю подменю — почти квадрат в
     двойной рамке. Прочие переключатели сцены — квадрат в тройной. Вторая и третья линии
     нарисованы тенью, а не border: рамка меняла бы размер кнопки и ломала раскладку ряда;
     ряды с кольцами получают чуть больший зазор, иначе кольца соседей сливаются.
     source, notes, stats и legend своей формы не меняют — владелец просил оставить как есть. */
  .stage-head > .seg > button{border-radius:7px}
  .stage-body .seg.sub.mlv3{gap:5px;row-gap:5px}
  .stage-body .seg.sub.mlv4{gap:7px;row-gap:7px}
  .stage-body .seg.sub.mlv3 button,.stage-body .seg.sub.mlv4 button{--ring:color-mix(in srgb, var(--hair) 90%, transparent)}
  .stage-body .seg.sub.mlv3 button.sq,.stage-body .seg.sub.mlv4 button.sq{--ring:color-mix(in srgb, var(--cyan) 42%, transparent)}
  .stage-body .seg.sub.mlv3 button.on,.stage-body .seg.sub.mlv4 button.on{--ring:color-mix(in srgb, var(--ochre) 45%, transparent)}
  .stage-body .seg.sub.mlv3 button.sq.on,.stage-body .seg.sub.mlv4 button.sq.on{--ring:color-mix(in srgb, var(--cyan) 50%, transparent)}
  .stage-body .seg.sub.mlv3 button{border-radius:4px;box-shadow:0 0 0 1px var(--surface),0 0 0 2px var(--ring)}
  .stage-body .seg.sub.mlv4 button{border-radius:2px;
    box-shadow:0 0 0 1px var(--surface),0 0 0 2px var(--ring),0 0 0 3px var(--surface),0 0 0 4px var(--ring)}
  .stage-body .seg.sub.mlv3 button.leg,.stage-body .seg.sub.mlv4 button.leg{border-radius:5px;box-shadow:none}
  /* Планшет цепочки данных и страница «About» (владелец 04.09, ночь) */
  .chain{position:relative;flex:1;min-height:0;overflow:auto}
  .chain-edges{position:absolute;left:0;top:0;pointer-events:none;z-index:0}

  .chain-h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin:0 0 8px;line-height:1.4}
  .chain-h span{display:block;text-transform:none;letter-spacing:0;font-family:var(--font-body, inherit);font-size:11px;color:var(--soft);margin-top:2px}

  .chain-node .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .chain-node .dot.bad{background:var(--ochre)}

  .chain-node .cn-s{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
  .chain-node .cn-m{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:4px}
  .chain-node .cn-m a{color:var(--cyan);text-decoration:none}
  .about{max-width:70ch;display:flex;flex-direction:column;gap:14px;padding:2px 2px 12px}
  /* реестр ссылок (владелец 05.09) */
  .refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;padding:2px 2px 10px}
  .ref{border:1px solid var(--line, var(--hair));border-radius:9px;padding:7px 10px;background:var(--surface);min-width:0}
  .ref:hover{border-color:var(--ochre)}

  .ref .ref-t a:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
  .ref .ref-t .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .ref .ref-t .dot.bad{background:var(--ochre)} .ref .ref-t .dot.off{background:var(--soft);opacity:.5}
  .ref .ref-n{margin-inline-start:auto;font-family:var(--mono);font-size:9.5px;color:var(--soft);white-space:nowrap}
  .ref .ref-d{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
  .ref .ref-m{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:4px;overflow-wrap:anywhere}
  /* полный экран цепочки (владелец 05.09) */
  .stage.full{position:fixed;inset:0;z-index:150;background:var(--bg);padding:10px 16px;overflow:auto;border-radius:0}

  .news{display:grid;grid-template-columns:3fr 2fr;gap:12px 24px;padding:2px 2px 10px}
  .news-col{min-width:0}
  .news-i{border:1px solid var(--line, var(--hair));border-radius:9px;padding:7px 10px;margin-bottom:8px;background:var(--surface)}
  .news-i .ni-h{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .news-i .ni-t{font-size:13px;color:var(--text);margin-top:2px;line-height:1.4}
  .news-i .ni-s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .news-i .ni-w{font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.45;border-top:1px solid var(--hair-soft);padding-top:3px}
