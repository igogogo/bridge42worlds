<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El Niño 2026–2027 — bridge42worlds</title>
<meta name="description" content="Is El Niño under way, how strong is it against history, where is it heading, are the forecast models keeping up, and what does it mean for food. One panel, recomputed from NOAA, OISST, ERA5, IRI and FAO data.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=4d92440750">
<style>
  /* ПАНЕЛЬ, А НЕ СТРАНИЦА (владелец 03.09: «одностраничный, без прокруток, это панель, на
     ней всё должно быть динамическое»), с правками второго разбора:

       · строка «обновлено / докуда ряды / источники» — НАВЕРХУ, у каждого источника своё
         пояснение по наведению;
       · подвал объяснений НЕПОДВИЖЕН: фиксированная высота в три строки, чтобы он не дёргал
         раскладку при наведении, а рядом с курсором висит карточка-абзац;
       · левый борт — карточки: состояние, тревоги по климату, по ценам и по моделям,
         разбор «как ломаются модели», вердикт;
       · переключатель «сейчас / что изменилось с прошлого измерения» в шапке — числа
         показываются либо значением, либо дельтой;
       · графики рисуются под размер окна и перерисовываются при изменении размера и темы.

     Цвета события отдельно от акцента сайта: охра — интерфейс, красный «Ниньо» и синий
     «Нинья» и пять уровней риска — семантика данных. */
  :root{
    --nino:#A8432B; --nina:#4A6FA5; --ok:#4A7C59;
    --lv5:#7A1F1F; --lv4:#A8432B; --lv3:#C9843A; --lv2:#8F8A81; --lv1:#B9B4AB;
    --band:#B9B4AB; --grid:color-mix(in srgb, var(--ink) 12%, transparent);
    --a1982:#7D5B8F; --a1997:#B06A8F; --a2015:#C07B53; --a2023:#D08A2B;
    /* прошлый год — не событие, поэтому нейтральный серый, а не цвет аналога */
    --a2025:#8A8F98; --a2024:#8A8F98;
    --rail:286px; --rail2:310px; --dockh:34px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --nino:#D4735C; --nina:#7C9BCB; --ok:#7BAA88; --band:#5c5a55;
      --lv2:#6f6c66; --lv1:#4f4d49; --a1982:#A98BBB; --a1997:#D39BB9; --a2015:#E0A07E; --a2023:#E8B45C;
      --a2025:#9AA0AA; --a2024:#9AA0AA; }
  }
  [data-theme="dark"]{ --nino:#D4735C; --nina:#7C9BCB; --ok:#7BAA88; --band:#5c5a55;
      --lv2:#6f6c66; --lv1:#4f4d49; --a1982:#A98BBB; --a1997:#D39BB9; --a2015:#E0A07E; --a2023:#E8B45C;
      --a2025:#9AA0AA; --a2024:#9AA0AA; }

  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  /* Общий стиль сайта держит body в читательской колонке (max-width 700px) — панели нужен
     весь экран, иначе середина схлопывается в 60 пикселей. */
  body{background:var(--bg);color:var(--text);max-width:none;width:100%;margin:0;padding:0}
  .langs-row,.nav-live{display:none !important}

  /* Строки сетки: шапка, сцена, подвал, строка обновлений. Когда строка обновлений уехала
     из шапки вниз, порядок строк остался прежним — и она попала в неявную пятую строку,
     налезая на подвал. Описываем ровно те четыре, что есть. */
  /* Строки назначаем ПОИМЕННО, а не по порядку детей: sitenav.js вставляет в панель свой
     пустой ряд языков, он забирал строку сетки, и строка обновлений уезжала в неявную
     пятую — поверх подвала. Теперь у каждого своя строка, и чужая вставка ничего не
     сдвигает. */
  /* Строка подвала — auto, а не фиксированная: подвал теперь несёт две строки (подсказку
     и обновления), и жёсткая высота обрезала вторую. Неподвижность подвала держится не
     высотой строки сетки, а его собственным min-height и обрезкой текста в три строки —
     то есть он по-прежнему не прыгает при смене подсказки. */
  /* КОЛОНКА, А НЕ СЕТКА ИЗ ЧЕТЫРЁХ СТРОК. Сетка требовала, чтобы детей было ровно столько,
     сколько строк, — а sitenav.js добавляет в панель свой ряд, и строки разъезжались: под
     сценой оставалось сорок пикселей пустоты, которых никто не просил (владелец 04.09:
     «поле где графики фиксированной высоты, можно же сделать больше, прям до нижней
     строчки, а то на ноуте много пустого места»). Колонке всё равно, сколько детей:
     шапка и подвал занимают своё, сцена забирает ВСЁ остальное до самого низа. */
  .panel{display:flex;flex-direction:column;height:100dvh;gap:7px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-sizing:border-box}
  .panel > .mid{flex:1 1 auto;min-height:0}
  .panel > .top-bar,.panel > .dock,.panel > .langs-row{flex:0 0 auto}

  /* ── шапка ────────────────────────────────────────────────────────────────── */
  /* justify-content:flex-start — против общего стиля сайта, где шапка распределяет элементы
     поровну (там это нужно, чтобы гамбургер не висел посреди). Пока ряд вкладок занимал всю
     свободную ширину, это не было видно; стоило вкладкам уехать на свою строку — логотип,
     гамбургер, ночной режим и заголовок разъехались по всей ширине. */
  /* Отступ слева тот же, что у текста внутри карточек (плитка + её padding), — тогда
     логотип, вкладки и слово STATE стоят на одной вертикали, а не вразнобой
     (владелец 04.09: «всё должно быть выровнено по рамке, где state»). */
  .top-bar{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 0 0 23px;margin:0;
    max-width:none;min-width:0;flex-wrap:wrap;row-gap:5px;height:auto;min-height:32px;flex-shrink:0}
  .logo{font-family:var(--font-display);font-size:14px;color:var(--soft);text-decoration:none;white-space:nowrap}
  .logo:hover{color:var(--accent)}
  .p-title{font-family:var(--font-display);font-size:clamp(13px,1.4vw,15px);font-weight:600;white-space:nowrap}
  .p-title b{color:var(--nino);font-weight:600}
  .theme-toggle{background:none;border:1px solid var(--line, var(--hair));color:var(--soft);
    border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:12px;flex-shrink:0}
  /* ВКЛАДКИ — ВСЕГДА ОТДЕЛЬНОЙ СТРОКОЙ, И БЕЗ ПРОКРУТКИ. Владелец 04.09: «верхнее меню тоже
     надо пониже отдельной строкой, где state, risk и так далее, чтобы без прокруток или в две
     строки». В одной строке с логотипом, гамбургером, ночным режимом и заголовком девяти
     кнопкам места не остаётся ни на каком экране: они уезжали вбок, и половину меню было не
     достать. Теперь шапка переносится, вкладки идут во всю ширину под ней и при нехватке
     места переходят на вторую строку — прокрутки нет нигде. */
  /* Вкладки начинаются там же, где основное поле со сценой: слева от него — колонка
     состояния, и меню, начинающееся от её края, читалось как её часть (владелец 04.09:
     «раз меню переехало на свою строку, пусть начинается не от state, а от поля основного
     с графиками»). Отступ считается из ширины колонки, поэтому меняется вместе с ней. */
  /* Ширина строки — 100 % МИНУС отступ слева: иначе с ростом числа вкладок строка не
     переносилась, а уезжала за правый край (владелец 05.09, четырнадцать вкладок). */
  /* Меню стало большим — выравниваем влево, по оси названия вверху (владелец 05.09). */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;row-gap:4px;overflow:visible;min-width:0;
    flex:0 0 100%;order:9;margin-inline-start:0;
    padding-bottom:3px}
  /* значок «i» с подсказкой у пунктов меню и подменю */
  .ti{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:50%;
    border:1px solid currentColor;font:italic 600 8.5px Georgia,serif;line-height:1;margin-inline-start:6px;opacity:.55;
    cursor:help;vertical-align:1px}
  .ti:hover{opacity:1}
  .tab.on .ti,.seg button.on .ti{opacity:.85}
  @media (max-width:560px){ .tab .ti{display:none} }   /* на телефоне меню и так в пять строк */   /* отбивка от рамки сцены: меню не должно лежать на ней */
  .tabs::-webkit-scrollbar{display:none}
  /* Чётче: цвет основного текста вместо приглушённого и чуть плотнее начертание —
     меню должно читаться с первого взгляда (владелец 04.09). */
  .tab{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--text);font-weight:500;background:none;
    border:1px solid var(--line, var(--hair));border-radius:999px;padding:5px 12px;
    cursor:pointer;white-space:nowrap;transition:color .15s,background .15s,border-color .15s}
  .tab:hover{color:var(--ochre)}
  /* Выбранное — заливкой, как вердикт (владелец 05.09): «если выбран — такой же вид, как
     подсветка verdict»; сам вердикт — контрастно чёрно-белый, при выборе наоборот; служебные
     (метод, цепочка, о панели) — пунктирная рамка и приглушённый цвет. */
  .tab.on{color:var(--surface);border-color:var(--ochre);background:var(--ochre);font-weight:600}
  .tab.svc{border-style:dashed;color:var(--soft)}
  .tab.svc:hover{color:var(--text)}
  .tab.svc.on{background:var(--soft);border-color:var(--soft);border-style:solid;color:var(--surface)}
  /* Вердикт — не такая вкладка, как остальные: это ответ на вопрос «ну и что?», и он должен
     бросаться в глаза первым (владелец 04.09: «ссылку на вердикт отдельным пунктом и поярче,
     может инверсно»). Инверсия: заливка цветом события, текст на ней светлый. */
  .tab.verdict{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;
    margin-inline-end:8px}
  .tab.verdict:hover{background:var(--text);color:var(--bg)}
  .tab.verdict.on{background:var(--bg);border-color:var(--ink);color:var(--ink)}
  /* Кнопки «сейчас / что изменилось» больше нет: сравнение переехало на кирпичи. */

  /* ── строка обновления и источников (наверху, а не в подвале) ─────────────── */
  /* Строка обновлений живёт в шапке справа: прижата авто-отступом, в одну строку,
     при нехватке места прокручивается вбок, а не ломает шапку. */
  .p-meta{display:flex;align-items:center;gap:4px 14px;flex-wrap:nowrap;font-family:var(--mono);
    margin-inline-start:auto;justify-content:flex-end;min-width:0;max-width:62%;
    overflow-x:auto;scrollbar-width:none;
    font-size:10.5px;color:var(--soft);padding:0 2px;min-height:16px}
  .p-meta > span{white-space:nowrap}
  .p-meta b{font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-size:9.5px}
  .p-meta i{font-style:normal;opacity:.75}
  .p-meta .bad, .p-meta .bad b{color:var(--nino)}
  .p-meta::-webkit-scrollbar{display:none}

  /* ── средняя часть ───────────────────────────────────────────────────────── */
  .mid{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--rail2);gap:8px;min-height:0}
  .col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  .tile{border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--surface);
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .tile > .th{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:8px 12px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--soft);flex-shrink:0}
  .tile > .th .rt{letter-spacing:0;text-transform:none;font-size:11px}
  .tile > .tb{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;scrollbar-width:thin}
  .tile > .tb.flush{padding:0}
  .tile.grow{flex:1}

  /* ── карточки левого борта ───────────────────────────────────────────────── */
  .cards{display:flex;flex-direction:column;gap:7px}
  .card{border:1px solid var(--line, var(--hair));border-radius:10px;padding:9px 11px;
    background:var(--tag-bg, transparent)}
  .card .ch{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-family:var(--mono);font-size:9px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .card .ch b{padding:1px 5px;border-radius:3px;color:#fff;font-weight:600;background:var(--lv2)}
  .card .ch .kk{opacity:.8}
  .card .ch .new{margin-inline-start:auto;color:var(--ochre);border:1px solid color-mix(in srgb, var(--ochre) 45%, var(--hair));
    border-radius:999px;padding:0 5px}
  .card .ct{font-size:13px;font-weight:600;line-height:1.35}
  .card .cd{font-size:12px;line-height:1.5;color:var(--muted);margin-top:3px}
  .card .cd.chronic b{color:var(--text);font-weight:600}
  .alert-card.lv-shout{border-color:var(--lv5);background:color-mix(in srgb, var(--lv5) 9%, transparent)}
  .alert-card.lv-shout .ch b{background:var(--lv5)}
  .alert-card.lv-watch{border-color:color-mix(in srgb, var(--lv3) 55%, var(--hair));
    background:color-mix(in srgb, var(--lv3) 7%, transparent)}
  .alert-card.lv-watch .ch b{background:var(--lv3)}
  .alert-card.kind-food .ch .kk{color:var(--lv3)}
  .alert-card.kind-models .ch .kk{color:var(--nina)}
  .card.quiet{border-color:color-mix(in srgb, var(--ok) 45%, var(--hair));background:color-mix(in srgb, var(--ok) 7%, transparent)}
  .models-card{cursor:pointer}
  .models-card:hover{border-color:color-mix(in srgb, var(--ochre) 50%, var(--hair))}
  .models-card .spark{margin-top:6px}
  .chgline{font-family:var(--mono);font-size:10px;color:var(--soft);margin-top:4px;display:block}
  /* Контекстные ссылки на разобранные работы: чип у якоря и полный список в сцене риска. */
  .lk{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;margin-inline-start:6px;
    padding:1px 6px;border-radius:999px;border:1px solid color-mix(in srgb, var(--cyan) 45%, var(--hair));
    color:var(--cyan);white-space:nowrap;text-decoration:none;vertical-align:1px}
  .links-box{border-top:1px solid var(--line, var(--hair));padding-top:8px;flex-shrink:0}
  .lk-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
  .lk-i{display:block;text-decoration:none;color:var(--text);padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--ink) 6%, transparent)}
  .lk-i:last-of-type{border-bottom:0}
  .lk-i b{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
  .lk-i:hover b{color:var(--cyan)}
  .lk-i span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
  .lk-i i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
  .lk-n{font-size:10.5px;color:var(--soft);line-height:1.45;margin-top:5px}
  .new{font-family:var(--mono);font-size:9px;color:var(--ochre)}

  /* Индекс риска — по центру сверху, текст под ним (владелец 04.09). Раньше круг стоял
     слева, а справа шла колонка мелких строк: цифра терялась, а мелкая подпись под шкалой
     не читалась вовсе — её убрали. */
  .gauge-row{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .gauge-row .g-side{width:100%}
  .gauge{--v:0;--c:var(--ok);width:74px;height:74px;border-radius:50%;position:relative;flex-shrink:0;
    background:conic-gradient(var(--c) calc(var(--v)*1%), color-mix(in srgb, var(--ink) 9%, transparent) 0);
    display:grid;place-items:center;cursor:help}
  .gauge::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
  .gauge .gv{position:relative;font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--c);line-height:1}
  /* Подпись шкалы больше не живёт внутри круга: там она не помещалась и обрезалась. */
  .g-side .glab{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--soft);margin-bottom:3px}
  .g-side{font-size:12px;line-height:1.45;color:var(--muted);min-width:0}
  .g-side b{display:block;font-family:var(--font-display);font-size:14px;color:var(--text);line-height:1.25;margin-bottom:2px}

  .verdict .vv{font-family:var(--font-display);font-size:13.5px;line-height:1.4;margin:0 0 6px}
  .verdict .vv.on{color:var(--lv5)}
  .verdict dl{margin:0}
  .verdict dt{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--soft);margin-top:7px}
  .verdict dd{margin:1px 0 0;font-size:12px;line-height:1.45;color:var(--muted)}
  .verdict ul{margin:2px 0 0 15px;padding:0;font-size:12px;color:var(--muted)}

  /* ── сцена ───────────────────────────────────────────────────────────────── */
  .stage{display:flex;flex-direction:column;min-height:0;min-width:0}
  .stage-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px 4px;flex-shrink:0}
  /* Заголовок сцены и переключатели: если заголовку остаётся меньше 320 пикселей, он
     уезжает на свою строку целиком — иначе он вставал колонкой в три-четыре этажа и съедал
     высоту графика (поймано на 1280×720). */
  .stage-h{font-family:var(--font-display);font-size:clamp(14px,1.7vw,18px);font-weight:600;line-height:1.25;
    min-width:0;flex:1 1 320px;text-wrap:balance}
  .seg{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}
  .seg.sub{padding:0 0 2px}
  /* Планшет цепочки данных и страница «About» (владелец 04.09, ночь) */
  .chain{position:relative;flex:1;min-height:0;overflow:auto}
  .chain-edges{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
  .chain-cols{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 22px;padding:4px 2px 10px}
  .chain-h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin:0 0 8px;line-height:1.4}
  .chain-h span{display:block;text-transform:none;letter-spacing:0;font-family:var(--font-body, inherit);font-size:11px;color:var(--soft);margin-top:2px}
  .chain-node{border:1px solid var(--line, var(--hair));border-radius:9px;padding:7px 9px;margin-bottom:8px;background:var(--surface);cursor:pointer;
    transition:opacity .15s ease, border-color .15s ease}
  .chain-node.dim{opacity:.32}
  .chain-node.lit{border-color:color-mix(in srgb, var(--ochre) 55%, var(--hair))}
  .chain-node.on{border-color:var(--ochre);box-shadow:0 0 0 2px color-mix(in srgb, var(--ochre) 25%, transparent)}
  .chain-node .cn-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
  .chain-node .cn-h b{font-weight:600;overflow-wrap:anywhere;min-width:0}
  .chain-node{min-width:0;overflow-wrap:anywhere}
  .chain-col{min-width:0}
  .chain-node .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .chain-node .dot.bad{background:var(--ochre)}
  .chain-node .dot.off{background:var(--soft);opacity:.5}
  .chain-node .cn-s{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
  .chain-node .cn-m{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:4px}
  .chain-node .cn-m a{color:var(--cyan);text-decoration:none}
  .about{max-width:70ch;display:flex;flex-direction:column;gap:14px;padding:2px 2px 12px}
  /* реестр ссылок (владелец 05.09) */
  .refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;padding:2px 2px 10px}
  .ref{border:1px solid var(--line, var(--hair));border-radius:9px;padding:7px 10px;background:var(--surface);min-width:0}
  .ref:hover{border-color:var(--ochre)}
  .ref .ref-t{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);line-height:1.35}
  .ref .ref-t a{color:var(--text);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--cyan) 45%, transparent);min-width:0}
  .ref .ref-t a:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
  .ref .ref-t .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .ref .ref-t .dot.bad{background:var(--ochre)} .ref .ref-t .dot.off{background:var(--soft);opacity:.5}
  .ref .ref-n{margin-inline-start:auto;font-family:var(--mono);font-size:9.5px;color:var(--soft);white-space:nowrap}
  .ref .ref-d{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
  .ref .ref-m{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:4px;overflow-wrap:anywhere}
  /* полный экран цепочки (владелец 05.09) */
  .stage.full{position:fixed;inset:0;z-index:150;background:var(--bg);padding:10px 16px;overflow:auto;border-radius:0}
  .stage.full .chain-cols{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 40px}
  /* подсказка с работами: абзацами */
  .tip .wk-p{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--hair-soft);font-size:12px;line-height:1.45}
  .tip .wk-p:first-of-type{border-top:0;padding-top:0;margin-top:2px}
  .tip .wk-p b{font-size:12.5px;margin-bottom:2px;padding:0}
  .tip .wk-p i{display:block;color:var(--soft);font-size:11px;margin-top:2px}
  .tip .wk-p a{display:inline-block;margin-top:3px;color:var(--cyan);text-decoration:none;font-family:var(--mono);font-size:10.5px}
  /* лента новостей */
  .news{display:grid;grid-template-columns:3fr 2fr;gap:12px 24px;padding:2px 2px 10px}
  .news-col{min-width:0}
  .news-i{border:1px solid var(--line, var(--hair));border-radius:9px;padding:7px 10px;margin-bottom:8px;background:var(--surface)}
  .news-i.k-alert{border-inline-start:3px solid var(--nino)}
  .news-i.k-risk{border-inline-start:3px solid var(--lv4)}
  .news-i.k-verdict{border-inline-start:3px solid var(--ochre)}
  .news-i.k-cal{border-inline-start:3px solid var(--cyan)}
  .news-i.k-watch{border-inline-start:3px solid var(--soft)}
  .news-i .ni-h{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .news-i .ni-t{font-size:13px;color:var(--text);margin-top:2px;line-height:1.4}
  .news-i .ni-s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .news-i .ni-w{font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.45;border-top:1px solid var(--hair-soft);padding-top:3px}
  .news-i .ni-go{margin-top:4px}
  @media (max-width:900px){ .news{grid-template-columns:1fr} }
  .about h3{font-family:var(--font-display);font-size:15px;margin:0 0 4px;color:var(--text)}
  .about p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
  @media (max-width:900px){ .chain-cols{grid-template-columns:1fr 1fr} .chain-edges{display:none} }
  @media (max-width:560px){ .chain-cols{grid-template-columns:1fr} }
  /* Экспертиза 04.09: ссылки в справочных врезках (телесвязь, импорт) и подписи «цитата, не замер» */
  .gl-i a{color:var(--cyan);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--cyan) 40%, transparent)}
  .gl-i a:hover{border-bottom-color:var(--cyan)}
  .kpi .kv small br{display:none}
  /* Подменю сцены читается наравне с верхним меню: цвет основного текста, не приглушённый. */
  .seg button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--text);font-weight:500;
    background:none;border:1px solid var(--line, var(--hair));border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--ochre)}
  .seg button.on{color:var(--surface);border-color:var(--ochre);background:var(--ochre);font-weight:600}
  .stage-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px 8px;gap:8px}
  .stage-body.scroll{overflow:auto}
  /* График — главный житель сцены: не меньше половины её высоты, что бы ни делали подписи. */
  .plot{flex:1 1 55%;min-height:170px;display:block;position:relative}
  /* значок даты данных (владелец 05.09) */
  /* Значок — всегда в правом нижнем углу плашки и без подложки (владелец 05.09). Плашки
     становятся опорой для абсолютного позиционирования, а нижняя строка получает запас
     справа, чтобы кнопка history не легла под значок. */
  .dcal{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;color:var(--soft);opacity:.75;
    cursor:help;flex:none;position:absolute;inset-inline-end:5px;bottom:5px;z-index:2}
  .dcal:hover{color:var(--ochre);opacity:1}
  .dcal-wrap{position:absolute;inset-inline-end:0;bottom:0;width:0;height:0;z-index:2}
  .dcal-wrap .dcal{inset-inline-end:6px;bottom:6px}
  .kpi,.card,.risk,.ov-kpi{position:relative}
  .kj .jsrc{padding-inline-end:18px}
  .risk .rf{padding-inline-end:22px}
  .ov-kpi .km{padding-inline-end:16px}
  .plot svg{display:block;width:100%;height:100%}
  .plot svg text{font-family:var(--mono);font-size:11px;fill:var(--soft)}
  .plot svg text.tt{font-size:12px;font-weight:600;fill:var(--text)}
  /* Выбранный элемент легенды: подчёркнут и ярче — видно, что именно высвечено. */
  .plot svg g.pick text{cursor:pointer}
  .plot svg g.pick:hover text{fill:var(--ochre)}
  .plot svg g.pick.on text{fill:var(--ochre);font-weight:600}
  .cap{font-size:11.5px;color:var(--soft);line-height:1.5;flex-shrink:0}
  .tbl-inline{max-height:38%;overflow:auto;flex-shrink:0;border-top:1px solid var(--line, var(--hair));padding-top:4px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;flex-shrink:0}
  .kpi{border:1px solid var(--line, var(--hair));border-radius:10px;padding:7px 10px;background:var(--tag-bg, transparent)}
  .kpi .kn{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
  .kpi .kv{font-family:var(--font-display);font-size:22px;line-height:1.05;margin:2px 0;font-variant-numeric:tabular-nums}
  .kpi .kv small{font-size:11px;color:var(--soft);font-family:var(--mono);margin-inline-start:4px}
  .kpi .km{font-size:11.5px;color:var(--muted);line-height:1.4}
  .kpi .kd{font-family:var(--mono);font-size:10px;color:var(--soft);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .up{color:var(--nino)} .dn{color:var(--nina)}

  /* ── правый борт ─────────────────────────────────────────────────────────── */
  .risk{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:7px 2px;
    border-top:1px solid var(--line, var(--hair));cursor:pointer;align-items:start}
  .risk:first-child{border-top:0}
  .risk:hover{background:color-mix(in srgb, var(--ochre) 7%, transparent)}
  .risk.on{background:color-mix(in srgb, var(--ochre) 12%, transparent)}
  .risk .rl{width:24px;height:24px;border-radius:6px;color:#fff;font-family:var(--font-display);
    font-weight:600;font-size:13px;display:grid;place-items:center}
  .risk .rt{font-size:12.5px;font-weight:600;line-height:1.3}
  .risk .rh{font-family:var(--mono);font-size:9.5px;color:var(--soft);margin-top:2px}
  .risk .rs{margin-top:3px}

  /* ── таблицы ─────────────────────────────────────────────────────────────── */
  table.e{border-collapse:collapse;width:100%;font-size:12px}
  table.e th{position:sticky;top:0;z-index:1;background:var(--surface);font-family:var(--mono);font-size:9.5px;
    letter-spacing:.07em;text-transform:uppercase;color:var(--soft);text-align:left;padding:6px 8px;
    border-bottom:1px solid var(--line, var(--hair));white-space:nowrap;cursor:pointer}
  table.e th.sorted{color:var(--ochre)}
  table.e td{padding:5px 8px;border-bottom:1px solid color-mix(in srgb, var(--ink) 6%, transparent);vertical-align:middle}
  table.e tr:last-child td{border-bottom:0}
  table.e tbody tr:hover{background:color-mix(in srgb, var(--ochre) 6%, transparent)}
  table.e tbody tr.on{background:color-mix(in srgb, var(--ochre) 12%, transparent)}
  table.e td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  table.e td.top{color:var(--nino);font-weight:600}
  table.e td sup{color:var(--ochre);font-family:var(--mono);font-size:9px;margin-inline-start:2px}
  .cls{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:4px;color:#fff;white-space:nowrap}
  .cls.ok{background:var(--ok)} .cls.lag{background:var(--lv3)} .cls.broke{background:var(--lv5)} .cls.na{background:var(--lv2)}
  .src{font-family:var(--mono);font-size:10px;color:var(--soft)}
  .mini svg{width:74px;height:14px;display:block}
  .tally{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
  .tally span{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line, var(--hair));color:var(--muted)}
  .tally i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}

  /* РАСКЛАДКА ЖЁСТКАЯ. Пока ширины выпрашивались у содержимого, «что делать» получала
     остаток и шла по слову в строке. Теперь доли назначены: имя региона, уровни и колонка
     действий — явно, сезоны делят остаток поровну (их число задаётся данными). */
  table.regions{table-layout:fixed}
  table.regions th:first-child{width:16%}
  table.regions th.vul{width:7%}
  table.regions td:first-child{overflow-wrap:anywhere}
  table.regions td .sub{font-size:10.5px;color:var(--soft);margin-top:1px;max-width:22ch;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* «Что делать» — самая длинная колонка, поэтому ширину ей назначаем, а не выпрашиваем:
     без этого раскладка отдавала ей минимум, и строки шли по слову. */
  table.regions th.act{width:34%}
  table.regions td.act{font-size:11px;line-height:1.4;color:var(--muted)}
  /* Три сценария живут в одной колонке: три отдельные съедали ширину у «что делать». */
  table.e th.lvls{white-space:nowrap;text-align:center;letter-spacing:.04em;width:9%}
  table.e th.lvls .sc{cursor:pointer;padding:0 3px;opacity:.5}
  table.e th.lvls .sc.on{opacity:1;color:var(--ochre)}
  table.e td.lvls{white-space:nowrap;text-align:center;padding-inline:6px}
  table.e td.lvls .lvl{margin-inline:1px;cursor:pointer}
  .imp{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;
    color:var(--c);background:color-mix(in srgb, var(--c) 12%, transparent);border:1px solid color-mix(in srgb, var(--c) 38%, transparent)}
  .imp small{font-size:9px;opacity:.8;margin-inline-start:3px}
  .vbar{display:inline-flex;gap:2px}
  .vbar i{width:7px;height:11px;border-radius:2px;background:color-mix(in srgb, var(--ink) 10%, transparent)}
  .vbar i.on{background:var(--lv3)}
  .lvl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:12px;opacity:.7}
  .lvl.cur{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ochre)}
  .scen{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line, var(--hair));margin-inline-end:3px}
  .scen.on{color:var(--ochre);border-color:color-mix(in srgb, var(--ochre) 50%, var(--hair));
    background:color-mix(in srgb, var(--ochre) 10%, transparent)}

  .gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .gl-i{border:1px solid var(--line, var(--hair));border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5}
  .gl-i b{font-family:var(--font-display);font-size:13.5px;display:block;margin-bottom:2px}
  .gl-i .why{color:var(--muted);margin-top:3px}
  .gl-i .s{font-family:var(--mono);font-size:10px;color:var(--soft);margin-top:4px}
  .note{border-inline-start:3px solid var(--ochre);padding:2px 0 2px 11px;color:var(--muted);
    font-size:12px;line-height:1.55;flex-shrink:0}
  .note.warn{border-inline-start-color:var(--nino)}
  .note strong{color:var(--text);font-weight:600}
  .lead{font-size:12.5px;line-height:1.6;color:var(--muted);flex-shrink:0}
  .lead b{color:var(--text);font-weight:600}

  /* ── подвал: НЕПОДВИЖНАЯ высота в три строки ─────────────────────────────── */
  .dock{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr auto;gap:2px 12px;align-items:center;
    border:1px solid var(--line, var(--hair));border-radius:11px;background:var(--surface);
    padding:8px 14px;min-height:var(--dockh);box-sizing:border-box;overflow:hidden}
  .dock .dtxt{font-size:12.5px;line-height:1.5;min-width:0;max-height:100%;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .dock .dtxt b{font-family:var(--font-display);font-size:13.5px;margin-inline-end:6px}
  .dock .dtxt .hint{color:var(--soft);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .dock .dtxt .s{font-family:var(--mono);font-size:10px;color:var(--soft);display:block;margin-top:1px}

  /* ── журнал значений на кирпиче ───────────────────────────────────────────
     Три строки под числом: изменение к прошлому ЗНАЧЕНИЮ (не к прошлому прогону),
     изменение от начала события и подпись «источник · дата данных» с кнопкой истории. */
  .kj{margin-top:5px;display:flex;flex-direction:column;gap:1px;font-family:var(--mono);font-size:10px}
  .kj .jr{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kj .jr b{font-weight:600}
  .kj .up{color:var(--nino)}
  .kj .dn{color:var(--nina)}
  .kj .same{color:var(--soft)}
  .kj .jsrc{color:var(--soft);opacity:.85;display:flex;align-items:flex-start;gap:6px;
    flex-wrap:wrap;line-height:1.35}
  /* Источник ужимается, кнопка истории — никогда. Без min-width:0 длинная подпись
     источника не давала себя сжать, и кнопку выдавливало за край с overflow:hidden —
     она была в разметке, но нажать её было нельзя (владелец 04.09: «кнопки history
     где-то не нажимаются, например daily OISST»). */
  .kj .jsrc span{flex:1 1 auto;min-width:0}   /* переносится целиком, без многоточия */
  .kj .jsrc .jh{margin-inline-start:auto;align-self:flex-end}   /* history — в правом нижнем углу плашки (владелец 05.09) */
  .risk .rf{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px}
  .chain{overflow-x:hidden}
  .chain-node .cn-s,.chain-node .cn-m{overflow-wrap:anywhere}
  /* обзорный дашборд */
  .ov-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;flex-shrink:0;margin-bottom:8px}
  .ov-kpi{border:1px solid var(--line, var(--hair));border-radius:10px;padding:6px 9px;background:var(--tag-bg, transparent);cursor:pointer;min-width:0}
  .ov-kpi:hover{border-color:var(--ochre)}
  .ov-kpi .kn{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
  .ov-kpi .ov-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .ov-kpi .kv{font-family:var(--font-display);font-size:20px;line-height:1.05;margin:2px 0;font-variant-numeric:tabular-nums}
  .ov-kpi .kv small{font-size:10px;color:var(--soft);font-family:var(--mono);margin-inline-start:3px}
  /* Плашки обзора на телефоне: число с единицей не разрывается, дата не ломается посреди,
     подпись переносится по словам (владелец 06.09, мобильная версия обзора). */
  .ov-kpi .km{font-size:10.5px;color:var(--muted);line-height:1.35;overflow-wrap:break-word;word-break:normal}
  .ov-kpi .kv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov-kpi .kn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov-kpi .km .up{color:var(--nino)} .ov-kpi .km .dn{color:var(--nina)}
  .ov-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-bottom:10px}
  .ov-tile{border:1px solid var(--line, var(--hair));border-radius:10px;background:var(--surface);padding:5px 6px 4px;cursor:pointer;min-width:0;display:flex;flex-direction:column}
  .ov-tile:hover{border-color:var(--ochre);box-shadow:0 6px 18px -12px color-mix(in srgb, var(--ink) 40%, transparent)}
  /* Заголовок плитки — ровно одна строка: от него до графика везде одинаково (владелец 06.09) */
  .ov-tile .ov-t{font-family:var(--mono);font-size:9.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;height:13px;line-height:13px;flex:none;
    display:flex;align-items:center;gap:6px}
  /* Метка легенды — в строке названия карточки, у правого края (владелец 06.09) */
  .ov-leg{margin-inline-start:auto;flex:none;font-size:8.5px;letter-spacing:.06em;color:var(--soft);border:1px solid var(--hair);
    border-radius:7px;padding:0 6px;line-height:12px;cursor:help;background:var(--surface)}
  .ov-leg:hover{color:var(--ochre);border-color:var(--ochre)}
  .ov-tile .ov-p{height:150px;min-width:0}
  .ov-tile .ov-p svg{display:block;width:100%;height:100%}
  .ov-tile .ov-p svg text{font-family:var(--mono);font-size:11px;fill:var(--soft)}
  .ov-tile .ov-p svg text.tt{display:none}
  /* карта на весь экран: поле занимает почти всю высоту (владелец 06.09) */
  .stage.full .plot{min-height:calc(100vh - 210px)}
  /* Карта — форма 2:1 (наше двойное растяжение по вертикали). Без этого в полном экране
     на телефоне поле было 600 пикселей высотой, а карта 170 — сверху и снизу пустота. */
  /* Поле карты: пропорция 2:1, но flex-элемент со свободной высотой схлопывался в ноль —
     держим flex:none и запас снизу. */
  .plot.map-fit{flex:none;width:100%;height:auto;aspect-ratio:2.1/1;min-height:170px}
  .stage.full .plot.map-fit{aspect-ratio:2/1;min-height:220px;max-height:calc(100vh - 220px)}
  .stage.full .ov-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .stage.full .ov-tile .ov-p{height:170px}
  @media (max-width:1500px){ .ov-grid{grid-template-columns:repeat(4,minmax(0,1fr))} .stage.full .ov-grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
  @media (max-width:1100px){ .ov-grid,.stage.full .ov-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:700px){ .ov-grid,.stage.full .ov-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .ov-tile .ov-p{height:130px} }
  @media (max-width:430px){ .ov-grid,.stage.full .ov-grid{grid-template-columns:1fr} }
  .jh{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:none;border:1px solid var(--line, var(--hair));border-radius:999px;
    padding:1px 6px;cursor:pointer;flex-shrink:0}
  .jh:hover{color:var(--ochre);border-color:color-mix(in srgb, var(--ochre) 45%, var(--hair))}
  /* таблица истории внутри карточки */
  .htab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin-top:6px}
  .htab td{padding:2px 0;border-bottom:1px solid color-mix(in srgb, var(--ink) 6%, transparent)}
  .htab td.v{text-align:right;font-variant-numeric:tabular-nums}
  .htab td.a{text-align:right;width:52px}
  .htab tr:last-child td{border-bottom:0}
  .hmore{font-family:var(--mono);font-size:10px;color:var(--ochre);background:none;border:0;
    cursor:pointer;padding:4px 0 0}

  /* Карточка-абзац у курсора: то же содержимое, но рядом с тем, на что смотрят. */
  /* КАРТОЧКУ МОЖНО ТРОГАТЬ. Раньше стояло pointer-events:none и закрытие по уходу
     курсора: в карточке есть ссылки на разобранные работы, и дойти до них было нельзя
     (владелец 04.09). Теперь курсор в неё доходит, есть крестик, Esc и прикалывание. */
  /* Карточка выше всего на панели. Шапка сайта (.top-bar) держит z-index 90 — она липкая
     и должна перекрывать содержимое при прокрутке; но подсказка от строки источников
     всплывала прямо под ней и пряталась за ряд вкладок (владелец 04.09). Ставим её
     заведомо выше всех слоёв панели. */
  /* СКРЫТАЯ КАРТОЧКА НЕ ДОЛЖНА ЛОВИТЬ КЛИКИ. Владелец 04.09 (вечер): «опять старая проблема —
     часть кнопок подменю не нажимается». Спрятанная карточка оставалась прозрачной, но живой
     (pointer-events:auto при opacity:0): невидимый прямоугольник 330×320 висел там, где её
     показали в последний раз, — над кнопками подменю, — и съедал клики. Теперь спрятанная
     карточка не существует для мыши вовсе. */
  .tip{position:fixed;z-index:200;max-width:min(330px,62vw);max-height:min(320px,44vh);overflow:auto;
    pointer-events:none;visibility:hidden;opacity:0;
    transform:translateY(3px);transition:opacity .12s ease, transform .12s ease;
    background:var(--surface);border:1px solid var(--line, var(--hair));border-radius:11px;
    padding:10px 13px;font-size:12.5px;line-height:1.55;color:var(--text);
    box-shadow:0 10px 30px color-mix(in srgb, var(--ink) 22%, transparent)}
  .tip.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
  .tip.pin{border-color:color-mix(in srgb, var(--ochre) 55%, var(--hair))}
  .tip b{font-family:var(--font-display);font-size:13.5px;display:block;margin-bottom:3px;padding-inline-end:18px}
  .tip .x{position:absolute;top:6px;inset-inline-end:8px;background:none;border:0;cursor:pointer;
    color:var(--soft);font-size:14px;line-height:1;padding:2px 4px}
  .tip .x:hover{color:var(--nino)}
  .tip a{color:var(--ochre)}
  .tip .s{font-family:var(--mono);font-size:10px;color:var(--soft);display:block;margin-top:5px}
  .tip .s div{margin-top:2px}
  .tip .s a{color:var(--cyan);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--cyan) 45%, transparent)}
  .tip{overflow-x:hidden;overflow-wrap:anywhere;word-break:break-word}
  /* Легенда в подсказке: столбец «штрих + подпись», без переносов и без прокруток
     (владелец 06.09: «как легенду везде и без прокруток»). */
  .leg-list{display:flex;flex-direction:column;gap:3px;margin-top:5px}
  .leg-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text);white-space:nowrap;overflow-wrap:normal}
  .leg-row svg{flex:none}
  .tip:has(.leg-list){max-height:none;overflow:visible;max-width:min(360px,80vw)}
  select.rsel{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border:1px solid var(--line, var(--hair));border-radius:8px;
    background:var(--surface);color:var(--text);max-width:100%}

  /* Код зоны Ниньо: рамка и моноширинный шрифт, чтобы «3.4» не читалось как температура. */
  /* Кнопка перехода: из вердикта на сцену, где живёт число. */
  /* Полоска сравнения ядра индекса между событиями. */
  .jbar{display:block;height:5px;border-radius:3px;background:var(--nino);width:var(--w,0%);opacity:.7;margin-top:3px}
  /* Ссылка-переход в конце карточки тревоги. */
  .cgo{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ochre);cursor:pointer;margin-top:6px;display:inline-block}
  .cgo:hover{text-decoration:underline}
  .vgo{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ochre);background:none;border:1px solid color-mix(in srgb, var(--ochre) 35%, var(--hair));
    border-radius:999px;padding:2px 8px;cursor:pointer;margin-inline-end:6px;margin-top:4px}
  .vgo:hover{border-color:var(--ochre);background:color-mix(in srgb, var(--ochre) 10%, transparent)}
  .zn{display:inline-block;font-family:var(--mono);font-size:.92em;letter-spacing:.02em;
    border:1px solid color-mix(in srgb, var(--ochre) 45%, var(--hair));border-radius:4px;
    padding:0 4px;white-space:nowrap;text-decoration:none;
    background:color-mix(in srgb, var(--ochre) 8%, transparent)}
  .zn:hover{color:var(--ochre);border-color:var(--ochre)}
  /* Ссылка на разобранную работу: третья форма набора — скошенная плашка. Такая же, как в
     статьях, чтобы «наша работа» выглядела одинаково во всём проекте. */
  .lk.wk-chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
    border:1px solid color-mix(in srgb, var(--ochre) 45%, var(--hair));border-radius:3px 8px 3px 8px;
    padding:1px 7px;white-space:nowrap;color:var(--ochre);
    background:color-mix(in srgb, var(--ochre) 9%, transparent);text-decoration:none;cursor:help}
  .lk.wk-chip:hover{border-color:var(--ochre);background:color-mix(in srgb, var(--ochre) 16%, transparent)}
  .lk-i .lk-one{color:var(--text);display:block;margin:2px 0 3px}
  .wk-num{font-family:var(--mono);border:1px solid color-mix(in srgb, var(--ochre) 35%, var(--hair));
    border-radius:2px 6px 2px 6px;padding:0 4px}
  /* Модель: прямоугольная плашка холодного цвета — форма другая, чем у зоны, и цвет несёт
     класс: справляется, отстаёт, сломана. */
  .mn{display:inline-block;font-family:var(--mono);font-size:.9em;letter-spacing:.02em;
    border:1px solid color-mix(in srgb, var(--nina) 45%, var(--hair));border-radius:2px;
    padding:0 4px;white-space:nowrap;text-decoration:none;
    background:color-mix(in srgb, var(--nina) 7%, transparent)}
  .mn:hover{border-color:var(--nina);color:var(--nina)}
  .mn.lag{border-color:color-mix(in srgb, var(--lv3) 55%, var(--hair));
    background:color-mix(in srgb, var(--lv3) 8%, transparent)}
  .mn.broke{border-color:color-mix(in srgb, var(--lv5) 55%, var(--hair));
    background:color-mix(in srgb, var(--lv5) 8%, transparent)}

  /* Пунктирное подчёркивание — обещание подсказки; знак вопроса у курсора оставляем только
     там, где подчёркнуто. Владелец 04.09: «стрелка с вопросиком появляется везде» — это были
     плашки и строки источников, у которых своя рамка вместо подчёркивания. */
  [data-term],[data-src]{text-decoration:underline dotted color-mix(in srgb, var(--ochre) 55%, transparent);
    text-underline-offset:3px;cursor:help}
  .zn[data-term],.mn[data-src],.kj .jsrc [data-src],.p-meta [data-src]{text-decoration:none;cursor:default}
  [data-term]:hover,[data-src]:hover{color:var(--ochre)}
  .p-meta [data-src]{text-decoration:none}
  .p-meta [data-src]:hover{color:var(--ochre)}
  .e-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:14px}

  @media (max-width:1200px){ :root{--rail:250px;--rail2:270px} }
  @media (max-width:900px){
    :root{--dockh:86px}
    .mid{grid-template-columns:1fr}
    .col.rail{display:none}
    .col.rail.show{display:flex}
    .stage.hide{display:none}
    /* ВКЛАДКИ ВТОРОЙ СТРОКОЙ. Владелец 04.09: «съехало меню из-за появления ссылки на
       проект, надо второй строкой». В шапке слева стоят логотип, гамбургер от общего меню
       сайта и ночной режим — на 375 пикселях им остаётся полторы сотни, и семь вкладок
       уезжали в горизонтальную прокрутку: восемьсот пикселей в окне на сто сорок девять.
       Теперь шапка переносится, вкладки занимают всю ширину отдельной строкой. */
    .top-bar{flex-wrap:wrap;height:auto;row-gap:4px;padding-bottom:2px}
    /* Колонок на телефоне нет — отступ под них снимаем; строка обновлений становится
       отдельной строкой шапки, ей там свободно (владелец 04.09). */
    .tabs{width:100%;margin-inline-start:0}
    .p-meta{max-width:100%;flex:1 0 100%;order:8;justify-content:flex-start;margin-inline-start:0}
    /* На телефоне подвал берёт столько, сколько нужно ему, а сцена ужимается: жёсткая
       высота подвала обрезала строку обновлений, а она последняя и потому первой уходила
       за экран. */
    /* на телефоне порядок тот же, отдельных правил раскладке не нужно */
    .dock{height:auto;min-height:0;padding:6px 10px}
    .p-meta{font-size:9.5px;gap:2px 10px;flex-wrap:wrap;justify-content:flex-start}
    .p-title{display:none}
    .stage-head{flex-direction:column;align-items:flex-start;gap:6px}
    .stage-h{font-size:15px;flex:none;width:100%}
    /* НИЧЕГО НЕ ЕЗДИТ ВБОК. Сцена прокручивалась горизонтально (518 пикселей в 366), потому
       что ряд кирпичей стоял в две колонки и не влезал. По вертикали листать нормально, а
       вбок — нет: половина числа за краем экрана читается как ошибка вёрстки. */
    .stage-body{overflow-y:auto;overflow-x:hidden}
    .stage-body > *{max-width:100%;min-width:0}
    .plot{min-height:220px}
    .kpis{grid-template-columns:1fr}
    .kpi{min-width:0}
    table.regions{table-layout:auto}
    table.regions th.act,table.regions td.act{width:auto;max-width:none}
    /* На касании карточка теперь и есть единственный способ прочитать пояснение: подвал
       больше ничего не показывает, а карточка прикалывается по тапу и закрывается крестиком. */
    .tip{max-width:min(88vw,340px)}
  }
  /* Совсем узкие экраны: подписи и таблицы ужимаются ещё на шаг, но по-прежнему целиком. */
  @media (max-width:430px){
    .logo{font-size:12.5px;padding-inline-start:2px}
    .tab{font-size:11px;padding:4px 9px}
    .seg button{font-size:10.5px}
    table.e{font-size:11px}
    table.e td, table.e th{padding:4px 5px}
    .dock .dtxt{-webkit-line-clamp:4}
  }
  @media (max-width:560px){
    .panel{padding:6px 7px calc(6px + env(safe-area-inset-bottom))}
    .dock{padding:7px 10px}
  }
  /* ── живое: пульс «где мы сейчас», дыхание живых точек, ореол высокого индекса ──
     Владелец 05.09: «панель визуально динамичней — точка мигает концентрическими кругами,
     где-то помигать, где-то переливаться; это геймификация». Всё выключается системной
     настройкой prefers-reduced-motion ниже. */
  @keyframes b42-ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(4.2);opacity:0}}
  @keyframes b42-breathe{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes b42-glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--lv5) 60%, transparent)}70%{box-shadow:0 0 0 7px transparent}}
  @keyframes b42-halo{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent)}100%{box-shadow:0 0 0 16px transparent}}
  @keyframes b42-stroke{0%,100%{stroke-width:1.8;stroke-opacity:1}50%{stroke-width:3.4;stroke-opacity:.55}}
  svg .ring{fill:none;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:b42-ring 2.6s cubic-bezier(.15,.55,.35,1) infinite;pointer-events:none}
  svg .ring.r2{animation-delay:1.3s}
  .ov-p svg .ring{stroke-width:1;animation-name:b42-ring-s}
  @keyframes b42-ring-s{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
  svg rect.breathe{animation:b42-stroke 3s ease-in-out infinite}
  .gauge.hot::after{content:"";position:absolute;inset:-1px;border-radius:50%;animation:b42-halo 2.8s ease-out infinite;pointer-events:none}
  .alert-card.lv-shout .ch b{animation:b42-glow 2.8s ease-in-out infinite}
  .chain-node .dot:not(.bad):not(.off),.ref .ref-t .dot:not(.bad):not(.off){animation:b42-breathe 3.2s ease-in-out infinite}
  /* Телефон: строка плашек в один столбец — на двух колонках по 150px число, единица и
     дата ломались посреди слова (владелец 06.09). Плитки и так в один столбец. */
  @media (max-width:520px){
    .ov-strip{grid-template-columns:1fr}
    .ov-kpi .kv{font-size:22px}
    .ov-tile .ov-p{height:150px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div class="panel" id="panel">
  <header class="top-bar" id="bar">
    <a class="logo" href="/">bridge42worlds</a>
    <!-- Ночной режим стоит СРАЗУ ПОСЛЕ ЛОГОТИПА, и это не случайно: sitenav.js вставляет
         гамбургер в logo.nextSibling, то есть между ними, и в готовой шапке порядок
         получается логотип → гамбургер → ночной режим (владелец 04.09). -->
    <button type="button" class="theme-toggle" id="theme-toggle" title="Theme">◐</button>
    <div class="p-title" id="ptitle">El Niño <b>2026–2027</b></div>
    <!-- Даты источников стоят в первой строке справа: там для них есть место, а вниз за
         ними больше ходить не надо. Порядок в потоке важен: они ДО вкладок, иначе окажутся
         на второй строке вместе с ними. -->
    <div class="p-meta" id="pmeta"></div>
    <nav class="tabs" id="tabs"></nav>
    <!-- В ШАПКЕ БОЛЬШЕ НИЧЕГО. Строка обновлений стояла здесь справа и при узком окне
         наезжала на вкладки, физически перекрывая «Regions & food» и ряд подвкладок —
         кнопки переставали нажиматься (владелец 04.09). Она уехала под подвал: там ей
         самое место, потому что дата и источник каждого числа и так живут в подсказках. -->
  </header>

  <div class="mid" id="mid">
    <div class="col rail" id="railL"></div>
    <section class="tile stage" id="stage"><div class="e-empty" id="loading">Loading the data…</div></section>
    <div class="col rail" id="railR"></div>
  </div>

  <!-- Строка обновлений живёт ВНУТРИ подвала, а не отдельной строкой сетки: как отдельная
       она то забирала чужую строку, то налезала на подвал, стоило любой вставке появиться
       в панели. Внутри — одна коробка, и наложиться ей не на что. -->
  <!-- Подвала больше нет вовсе: подсказка живёт у курсора, а даты источников уехали
       наверх, вровень по правому краю шапки (владелец 04.09). Ни одной строки, ради которой
       надо смотреть вниз, на панели не осталось. -->
</div>
<div class="tip" id="tip"></div>

<script>
  (function(){
    var root=document.documentElement, key='b42_theme';
    try{ var s=localStorage.getItem(key); if(s) root.setAttribute('data-theme', s); }catch(e){}
    var b=document.getElementById('theme-toggle');
    if(b) b.addEventListener('click', function(){
      var cur=root.getAttribute('data-theme');
      var sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      var now=(cur||sys)==='dark'?'light':'dark';
      root.setAttribute('data-theme', now);
      try{ localStorage.setItem(key, now); }catch(e){}
      if(window.B42EnsoRedraw) window.B42EnsoRedraw();
    });
    /* Панель английская целиком (владелец 03.09). Меню сайта (sitenav.js) читает
       window.B42_LANG: пусть ведёт читателя в его язык, содержимое панели не меняется. */
    var L='en';
    try{ L=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('b42_lang')||'en').slice(0,2); }catch(e){}
    window.B42_LANG = ['ru','en','es','ar','fr'].indexOf(L)>=0 ? L : 'en';
  })();
</script>
<script src="/js/enso.js?v=6b9be972c0"></script>
<script src="/js/sitenav.js?v=cf6fd79772"></script>
</body>
</html>
