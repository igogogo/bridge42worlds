<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Niño 2026–2027 — bridge42worlds</title>
<meta name="description" content="Is El Niño under way, how strong is it against history, where is it heading, are the forecast models keeping up, and what does it mean for food. One page, recomputed from NOAA, OISST, ERA5 and IRI data.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=321f73c4a2">
<style>
  /* Страница устроена как остальные самостоятельные (research, ideas): одна на все языки,
     шапка сайта, содержимое фетчем из data/enso/*.json. Никаких пересборок: обновление
     дашборда = новый latest.json в R2, HTML не трогается.

     Порядок блоков — из ТЗ: вывод → доказательство → метод, на каждом блоке. Буквы A–H
     несут смысл (это последовательность чтения «за 60 секунд» сверху вниз), а не украшение.

     Цвета события — отдельно от акцента сайта: охра остаётся акцентом навигации и
     подписей, а тёплый красный «Ниньо» / синий «Нинья» и пять уровней риска — это
     семантика данных, они не должны спорить с брендом и не должны на него походить. */
  :root{
    --nino:#A8432B; --nina:#4A6FA5; --ok:#4A7C59;
    --lv5:#7A1F1F; --lv4:#A8432B; --lv3:#C9843A; --lv2:#8F8A81; --lv1:#B9B4AB;
    --band:#B9B4AB; --grid:color-mix(in srgb, var(--ink) 12%, transparent);
    --a1982:#7D5B8F; --a1997:#B06A8F; --a2015:#C07B53; --a2023:#D08A2B;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --nino:#D4735C; --nina:#7C9BCB; --ok:#7BAA88; --band:#5c5a55;
      --lv2:#6f6c66; --lv1:#4f4d49; --a1982:#A98BBB; --a1997:#D39BB9; --a2015:#E0A07E; --a2023:#E8B45C; }
  }
  [data-theme="dark"]{ --nino:#D4735C; --nina:#7C9BCB; --ok:#7BAA88; --band:#5c5a55;
      --lv2:#6f6c66; --lv1:#4f4d49; --a1982:#A98BBB; --a1997:#D39BB9; --a2015:#E0A07E; --a2023:#E8B45C; }

  /* Шапка и строка языков (её строит sitenav.js) вылезали за окно на 7px — страница
     скроллилась вбок. Коробка по границе и запас по ширине снимают это. */
  html,body{overflow-x:hidden}
  .top-bar,.langs-row{box-sizing:border-box;max-width:min(var(--col-wide, 1100px),100%)}
  .top-bar{display:flex;justify-content:space-between;align-items:center;
    max-width:var(--col-wide, 1100px);margin:0 auto 10px;padding:16px 16px 0}
  .logo{font-family:var(--font-display);font-size:15px;color:var(--soft);text-decoration:none}
  .logo:hover{color:var(--accent)}
  .theme-toggle{background:none;border:1px solid var(--line, var(--hair));color:var(--soft);
    border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:13px}

  .e-wrap{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 120px}
  .e-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:6px}
  .e-head h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,40px);line-height:1.1;margin:0 0 6px}
  .e-sub{color:var(--soft);font-size:14.5px;line-height:1.6;max-width:70ch}
  .e-meta{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .e-meta .stale{color:var(--nino)}
  .e-refresh{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .e-btn{font-family:var(--mono);font-size:12px;border:1px solid var(--line, var(--hair));background:var(--surface);
    color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
  .e-btn:hover{border-color:var(--ochre);color:var(--ochre)}
  .e-btn[disabled]{opacity:.5;cursor:default}

  /* Шкала риска: кольцо + число. Цвет — из уровня, не из акцента сайта. */
  .gauge{--v:0;--c:var(--ok);width:112px;height:112px;border-radius:50%;position:relative;
    background:conic-gradient(var(--c) calc(var(--v)*1%), color-mix(in srgb, var(--ink) 9%, transparent) 0);
    display:grid;place-items:center;flex-shrink:0}
  .gauge::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
  .gauge .gv{position:relative;font-family:var(--font-display);font-size:38px;font-weight:600;color:var(--c);line-height:1}
  .gauge .gl{position:relative;font-family:var(--mono);font-size:9.5px;color:var(--soft);text-align:center;line-height:1.2;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line, var(--hair));color:var(--soft);cursor:default}
  .chip.bad{border-color:var(--nino);color:var(--nino)}

  /* Баннер сторожа. Есть только когда есть срабатывания. */
  .shout{margin-top:22px;border:2px solid var(--lv3);border-radius:14px;padding:14px 18px;
    background:color-mix(in srgb, var(--lv3) 9%, var(--surface))}
  .shout.on{border-color:var(--lv5);background:color-mix(in srgb, var(--lv5) 9%, var(--surface))}
  .shout .sh{font-family:var(--font-display);font-size:clamp(18px,2.6vw,24px);font-weight:600;line-height:1.2;margin-bottom:6px}
  .shout.on .sh{color:var(--lv5)}
  .al{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line, var(--hair));font-size:14.5px;flex-wrap:wrap}
  .al:first-of-type{border-top:0}
  .al b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:4px;color:#fff;text-transform:uppercase;white-space:nowrap}
  .al5 b{background:var(--lv5)} .al3 b{background:var(--lv3)}
  .al .ald{display:block;color:var(--muted);font-size:13px;width:100%;padding-left:2px}

  /* Блок: буква-эйебрау, заголовок-вывод, тело; саммари модели в правой колонке на широком экране. */
  .blk{margin-top:44px;padding-top:22px;border-top:1px solid var(--line, var(--hair))}
  .blk .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
  .blk .eyebrow i{font-style:normal;font-weight:700;color:var(--ink);opacity:.55}
  .blk h2{font-family:var(--font-display);font-size:clamp(20px,3vw,27px);line-height:1.25;margin:0 0 10px;text-wrap:balance;max-width:34ch}
  .blk .lead{font-size:15.5px;line-height:1.7;max-width:70ch}
  .blk .lead b{font-weight:600}
  .two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
  /* min-width:0 — иначе колонка растёт под svg (min-width 560px) и на 375px выезжает за экран на 243px. */
  .two > *{min-width:0}
  @media (max-width:860px){ .two{grid-template-columns:1fr} }

  /* Саммари модели у блока: маленькая карточка, факты блока и только они. */
  .ai{border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--tag-bg, var(--surface));padding:12px 14px;font-size:13.5px;line-height:1.6}
  .ai .aih{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
  .ai .aih .err{color:var(--nino);text-transform:none;letter-spacing:0}
  .ai p{margin:0 0 6px}
  .ai b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:8px}
  .ai ul{margin:2px 0 0 16px;padding:0}
  .ai.big{padding:16px 18px;font-size:15px}
  .ai.big .verdict{font-family:var(--font-display);font-size:clamp(17px,2.4vw,21px);line-height:1.35;margin:0 0 8px;text-wrap:pretty}
  .ai.big .verdict.on{color:var(--lv5)}

  /* Числа с их смыслом: «сейчас · шаг · семь шагов · ход». */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
  .kpi{border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--surface);padding:12px 14px}
  .kpi .kn{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .kpi .kv{font-family:var(--font-display);font-size:30px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .kpi .kv small{font-size:14px;color:var(--soft);font-family:var(--mono);margin-left:4px}
  .kpi .km{font-size:13px;color:var(--muted);line-height:1.5}
  .kpi .kd{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
  .kpi .kd span{white-space:nowrap}
  .up{color:var(--nino)} .dn{color:var(--nina)}

  .fig{border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--surface);padding:12px 12px 8px;margin-top:14px;overflow-x:auto}
  .fig svg{display:block;width:100%;height:auto;min-width:560px}
  .fig svg text{font-family:var(--mono);font-size:11px;fill:var(--soft)}
  .fig svg text.tt{font-size:12px;font-weight:600;fill:var(--text)}
  .cap{font-size:13px;color:var(--muted);line-height:1.6;margin:8px 4px 4px;max-width:80ch}

  /* Карточки рисков: уровень слева, тело, спарклайн справа. */
  .risks{display:grid;gap:10px;margin-top:14px}
  .risk{display:grid;grid-template-columns:40px minmax(0,1fr) 260px;gap:14px;border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--surface);padding:12px 14px;align-items:start}
  @media (max-width:760px){ .risk{grid-template-columns:40px minmax(0,1fr)} .risk .rs{grid-column:2} }
  .risk .rl{width:38px;height:38px;border-radius:9px;color:#fff;font-family:var(--font-display);font-size:19px;font-weight:600;display:grid;place-items:center}
  .risk .rt{font-weight:600;font-size:15.5px;line-height:1.3}
  .risk .rt .rh{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--soft);margin-left:6px;white-space:nowrap}
  .risk .rp{font-size:14.5px;line-height:1.6;margin:5px 0;max-width:60ch}
  .risk .re{font-size:13px;color:var(--muted);line-height:1.55}
  .risk .rd{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:6px;line-height:1.6}
  .risk .rw{font-size:12.5px;color:var(--soft);margin-top:4px}
  .risk .rw b{font-weight:600;color:var(--muted)}
  .risk .rs svg{width:100%;height:auto;display:block}
  .risk .rs svg text{font-family:var(--mono);font-size:10px;fill:var(--soft)}
  .risk .rs svg text.tt{font-size:11px;font-weight:600;fill:var(--text)}

  /* Табло моделей. */
  .tbl{overflow-x:auto;border:1px solid var(--line, var(--hair));border-radius:12px;background:var(--surface);margin-top:14px}
  table.e{border-collapse:collapse;width:100%;font-size:13px}
  table.e th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line, var(--hair));white-space:nowrap}
  table.e td{padding:6px 10px;border-bottom:1px solid color-mix(in srgb, var(--ink) 7%, transparent);vertical-align:middle}
  table.e tr:last-child td{border-bottom:0}
  table.e td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  table.e td.top{color:var(--nino);font-weight:600}
  .cls{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;color:#fff;white-space:nowrap}
  .cls.ok{background:var(--ok)} .cls.lag{background:var(--lv3)} .cls.broke{background:var(--lv5)} .cls.na{background:var(--lv2)}
  .mini{display:inline-block;vertical-align:middle;width:90px;height:16px}
  .mini svg{width:90px;height:16px;display:block}
  .tally{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .tally span{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line, var(--hair))}
  .tally i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  /* Блок F: таблица регионов — чипы воздействия, шкала уязвимости, уровни по сценариям. */
  table.regions td .sub{font-size:11.5px;color:var(--soft);margin-top:2px;max-width:22ch}
  table.regions td b[data-src]{font-weight:600}
  table.regions td.act{font-size:12px;line-height:1.45;color:var(--muted);max-width:34ch}
  table.regions td.act div{margin:2px 0}
  .imp{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;
    color:var(--c);background:color-mix(in srgb, var(--c) 12%, transparent);border:1px solid color-mix(in srgb, var(--c) 40%, transparent)}
  .imp small{font-size:9.5px;opacity:.8;margin-left:3px}
  .vbar{display:inline-flex;gap:2px}
  .vbar i{width:9px;height:12px;border-radius:2px;background:color-mix(in srgb, var(--ink) 10%, transparent)}
  .vbar i.on{background:var(--lv3)}
  .lvl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;color:#fff;font-family:var(--font-display);font-weight:600;font-size:14px;opacity:.75}
  .lvl.cur{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ochre)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){ .grid2{grid-template-columns:1fr} }
  .note{border-left:3px solid var(--ochre);padding:4px 0 4px 14px;margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.65;max-width:70ch}
  .note.warn{border-left-color:var(--nino)}
  .note strong{color:var(--text);font-weight:600}
  .honest{margin-top:14px;padding:12px 15px;border-radius:11px;background:var(--tag-bg, var(--surface));border:1px solid var(--line, var(--hair));font-size:13.5px;line-height:1.65;color:var(--muted);max-width:70ch}

  /* Всё, что можно объяснить, подчёркнуто точками и показывает карточку внизу. */
  [data-term],[data-src]{text-decoration:underline dotted color-mix(in srgb, var(--ochre) 60%, transparent);text-underline-offset:3px;cursor:help}
  [data-term]:hover,[data-src]:hover,.hot{color:var(--ochre)}

  /* ДОК ОБЪЯСНЕНИЙ — закреплён внизу, сворачивается в полоску. Идея с диаграммы DDR:
     карточка у курсора закрывает то, что объясняет, и на телефоне у неё нет курсора;
     полоса внизу стоит на месте, и читатель знает, куда смотреть. Клик — закрепить,
     Esc или клик по фону — отпустить. */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--line, var(--hair));box-shadow:0 -8px 24px color-mix(in srgb, var(--ink) 10%, transparent);
    transform:translateY(calc(100% - 34px));transition:transform .22s ease}
  .dock.open{transform:none}
  .dock .dbar{max-width:var(--col-wide, 1100px);margin:0 auto;padding:7px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;height:34px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
  .dock .dbar b{font-weight:600;color:var(--text);text-transform:none;letter-spacing:0;font-family:var(--font-display);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dock .dbody{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 14px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px 22px;font-size:14px;line-height:1.6;min-height:96px;max-height:40vh;overflow:auto}
  @media (max-width:760px){ .dock .dbody{grid-template-columns:1fr;gap:6px} }
  .dock .dbody b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
  .dock .dbody .dsrc{font-family:var(--mono);font-size:12px;color:var(--soft)}
  .dock.pinned .dbar::after{content:"pinned · Esc";color:var(--ochre)}
  @media (prefers-reduced-motion: reduce){ .dock{transition:none} }

  .gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
  .gl-i{border:1px solid var(--line, var(--hair));border-radius:11px;background:var(--surface);padding:11px 13px;font-size:13.5px;line-height:1.55}
  .gl-i b{font-family:var(--font-display);font-size:15px;display:block;margin-bottom:3px}
  .gl-i .why{color:var(--muted);margin-top:4px}
  .gl-i .src{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:5px}
  .diff li{margin:4px 0;font-size:14px;line-height:1.55}
  .e-empty{padding:40px;text-align:center;color:var(--muted)}
  .srcs td:first-child{font-family:var(--mono);font-size:12px}
  .toc{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);
    margin:16px -16px 0;padding:6px 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line, var(--hair))}
  .toc a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);text-decoration:none;padding:5px 9px;border-radius:999px;white-space:nowrap}
  .toc a:hover,.toc a.on{color:var(--ochre);background:color-mix(in srgb, var(--ochre) 10%, transparent)}
  @media (max-width:640px){ .e-head{grid-template-columns:1fr} .gauge{width:96px;height:96px} .gauge .gv{font-size:32px} }
</style>
</head>
<body>
<div class="top-bar">
  <a class="logo" href="/">bridge42worlds</a>
  <button type="button" class="theme-toggle" id="theme-toggle" title="Theme">◐</button>
</div>

<div class="e-wrap" id="root">
  <div class="e-empty" id="loading">Loading the data…</div>
</div>

<div class="dock" id="dock" aria-live="polite">
  <div class="dbar" id="dbar"><span id="dtitle">Point at anything underlined: definition, source, date</span><b id="dname"></b></div>
  <div class="dbody" id="dbody"></div>
</div>

<script>
  /* Тема — как на всех самостоятельных страницах: сохранённый выбор, иначе системная. */
  (function(){
    var root=document.documentElement, key='b42_theme';
    try{ var s=localStorage.getItem(key); if(s) root.setAttribute('data-theme', s); }catch(e){}
    var b=document.getElementById('theme-toggle');
    if(b) b.addEventListener('click', function(){
      var cur=root.getAttribute('data-theme');
      var sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      var now=(cur||sys)==='dark'?'light':'dark';
      root.setAttribute('data-theme', now);
      try{ localStorage.setItem(key, now); }catch(e){}
    });
    /* Страница английская целиком (владелец 03.09). Меню сайта (sitenav.js) читает
       window.B42_LANG: пусть ведёт читателя в его язык, содержимое дашборда от этого не меняется. */
    var L='en';
    try{ L=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('b42_lang')||'en').slice(0,2); }catch(e){}
    window.B42_LANG = ['ru','en','es','ar','fr'].indexOf(L)>=0 ? L : 'en';
  })();
</script>
<script src="/js/enso.js?v=3"></script>
<script src="/js/sitenav.js?v=4ec05c36e3"></script>
<script src="/js/beta-banner.js?v=bc6f74ea82" defer></script>
</body>
</html>
