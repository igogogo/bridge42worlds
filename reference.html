<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Справочник — bridge42worlds</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=544b968372">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  /* Справочник собирается из уроков (reference_build.py), поэтому здесь только подача:
     поиск, три раздела и раскрытие обозначений. Формула без расшифровки символов бесполезна,
     так что обозначения открываются прямо в карточке, а не на отдельной странице. */
  .top-bar{display:flex;justify-content:space-between;align-items:center;
    max-width:var(--col-wide, 1100px);margin:0 auto 18px;padding:16px 16px 0}
  .logo{font-family:var(--font-display);font-size:15px;color:var(--soft);text-decoration:none}
  .logo:hover{color:var(--accent)}
  .theme-toggle{background:none;border:1px solid var(--line);color:var(--soft);border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:13px}

  .r-wrap{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 60px}
  .r-head h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin-bottom:8px}
  .r-sub{color:var(--soft);font-size:15px;margin-bottom:14px}
  .r-lead{max-width:70ch;font-size:15px;line-height:1.72;margin-bottom:22px}

  .r-search{width:100%;max-width:460px;font:inherit;font-size:14px;padding:9px 14px;border-radius:20px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .r-search:focus{outline:none;border-color:var(--accent)}
  .r-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .r-tab{font:inherit;font-size:12.5px;padding:6px 14px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--soft);display:inline-flex;gap:6px;align-items:center}
  .r-tab:hover{border-color:var(--accent);color:var(--accent)}
  .r-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .r-tab.on svg{color:#fff}
  .r-count{font-size:12.5px;color:var(--muted);margin-inline-start:auto;align-self:center}

  .r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-top:18px}
  .r-card{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:15px 16px;
    transition:border-color .18s, box-shadow .18s, transform .18s}
  .r-card:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(20,30,45,.07);transform:translateY(-1px)}
  .r-eq{text-align:center;font-size:19px;margin:4px 0 11px;overflow-x:auto}
  .r-name{font-family:var(--font-display);font-size:14.5px;font-weight:600;line-height:1.35}
  .r-alt{font-size:12px;color:var(--muted);margin-top:2px}
  .r-au{font-size:12px;color:var(--soft);margin-top:6px}
  .r-syms{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .r-syms-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
    font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
  .r-sym{display:flex;gap:9px;font-size:12.5px;line-height:1.55;margin-top:7px}
  .r-sym-k{min-width:26px;color:var(--accent);font-weight:700}
  .r-sym-v{color:var(--soft)}
  .r-card:not(.open) .r-sym{display:none}
  .r-go{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-top:10px;
    color:var(--accent);text-decoration:none}
  .r-go:hover{text-decoration:underline}

  .r-cst{display:flex;gap:12px;align-items:flex-start}
  .r-cst-s{font-size:18px;color:var(--accent);min-width:32px;text-align:center}
  .r-cst-n{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .r-cst-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .r-cst-u{font-size:11.5px;color:var(--soft);font-weight:400;margin-inline-start:4px}
  .r-cst-w{font-size:12.5px;line-height:1.6;color:var(--soft);margin-top:7px}
  .r-cst-m{font-size:12.5px;line-height:1.6;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}

  .r-pr-h{font-family:var(--font-display);font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
  .r-pr-h svg{color:var(--accent)}
  .r-pr-t{font-size:13.5px;line-height:1.68;color:var(--ink);margin-top:8px}
  .r-pr-w{font-size:11.5px;color:var(--muted);margin-top:9px}
  .r-empty{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:640px){ .r-grid{grid-template-columns:1fr} }
</style>
<script>
(function () {
  var allowed = ['ru', 'en', 'es', 'ar', 'fr'];
  var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  var saved = null;
  try { saved = localStorage.getItem('b42_lang'); } catch (e) {}
  var lang = allowed.indexOf(q) >= 0 ? q : (allowed.indexOf(saved) >= 0 ? saved : 'ru');
  window.B42_LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  try { localStorage.setItem('b42_lang', lang); } catch (e) {}
})();
</script>
</head>
<body>

<div class="top-bar">
  <a href="/learn.html" class="logo">bridge42worlds</a>
  <button type="button" class="theme-toggle" onclick="var h=document.documentElement;h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');">◐</button>
</div>

<div class="r-wrap">
  <div class="r-head">
    <h1 id="h"></h1>
    <div class="r-sub" id="sub"></div>
    <p class="r-lead" id="lead"></p>
    <input type="search" class="r-search" id="q">
  </div>
  <div class="r-tabs" id="tabs"></div>
  <div id="root"></div>
</div>

<script src="/js/icons.js?v=9b6ce125c4"></script>
<script>
(function () {
  var LANG = window.B42_LANG || 'ru';
  var root = document.getElementById('root');
  var D = null, tab = 'formulas', query = '';

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function ic(n, s) { return (window.B42Icons && B42Icons[n]) ? B42Icons[n](s || 14) : ''; }
  function tex(node, latex, display) {
    if (!window.katex) { node.textContent = latex; return; }
    try { katex.render(latex, node, { throwOnError: false, displayMode: display !== false }); }
    catch (e) { node.textContent = latex; }
  }
  function hit(text) { return !query || (text || '').toLowerCase().indexOf(query) >= 0; }

  function cardFormula(f) {
    var loc = f[LANG] || f.ru; if (!loc) return null;
    if (!hit([loc.name, loc.latex, loc.alsoKnown, loc.title].join(' '))) return null;
    var c = el('div', 'r-card');
    var eq = el('div', 'r-eq'); tex(eq, loc.latex); c.appendChild(eq);
    c.appendChild(el('div', 'r-name', loc.name || ''));
    if (loc.alsoKnown) c.appendChild(el('div', 'r-alt', loc.alsoKnown));
    var au = (loc.authors || []).map(function (a) { return a.who + ' · ' + a.year; }).join('   ·   ');
    if (au) c.appendChild(el('div', 'r-au', au));

    if ((loc.symbols || []).length) {
      var box = el('div', 'r-syms');
      var head = el('div', 'r-syms-t', ic('hash', 12) + ' ' + (T.symbols || ''));
      head.addEventListener('click', function () { c.classList.toggle('open'); });
      box.appendChild(head);
      loc.symbols.forEach(function (s) {
        var row = el('div', 'r-sym');
        var k = el('span', 'r-sym-k'); tex(k, s.sym || s.latex || '', false);
        row.appendChild(k);
        row.appendChild(el('span', 'r-sym-v', s.what || s.name || ''));
        box.appendChild(row);
      });
      c.appendChild(box);
    }
    var go = el('a', 'r-go', ic('book', 13) + ' ' + (T.openLesson || ''));
    go.href = '/course.html?t=' + f.topic + '&p=' + f.lesson + '&lang=' + LANG;
    c.appendChild(go);
    return c;
  }

  function cardConst(k) {
    var loc = k[LANG] || k.ru || k;
    if (!hit([loc.name, k.sym, k.value, loc.why].join(' '))) return null;
    var c = el('div', 'r-card');
    var row = el('div', 'r-cst');
    var s = el('div', 'r-cst-s'); tex(s, k.latex || k.sym || '', false);
    row.appendChild(s);
    var b = el('div');
    b.appendChild(el('div', 'r-cst-n', loc.name || ''));
    b.appendChild(el('div', 'r-cst-v', (k.value || '') +
      '<span class="r-cst-u">' + (k.unit || '') + '</span>'));
    row.appendChild(b);
    c.appendChild(row);
    if (loc.why) c.appendChild(el('div', 'r-cst-w', loc.why));
    if (loc.mnemo) c.appendChild(el('div', 'r-cst-m', ic('mnemo', 13) + ' ' + loc.mnemo));
    return c;
  }

  function cardPrinciple(p) {
    var loc = p[LANG] || p.ru;
    if (!hit([loc.h, loc.t].join(' '))) return null;
    var c = el('div', 'r-card');
    c.appendChild(el('div', 'r-pr-h', ic(p.icon, 16) + ' ' + loc.h));
    c.appendChild(el('div', 'r-pr-t', loc.t));
    c.appendChild(el('div', 'r-pr-w', (p.topics || []).join(' · ')));
    return c;
  }

  var T = {};
  function draw() {
    root.innerHTML = '';
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    [['formulas', 'formula'], ['constants', 'ruler'], ['principles', 'lamp']].forEach(function (pair) {
      var b = el('button', 'r-tab' + (tab === pair[0] ? ' on' : ''), ic(pair[1]) + ' ' + T[pair[0]]);
      b.type = 'button';
      b.addEventListener('click', function () { tab = pair[0]; draw(); });
      tabs.appendChild(b);
    });
    var cnt = el('span', 'r-count');
    tabs.appendChild(cnt);

    var grid = el('div', 'r-grid'), n = 0;
    var src = tab === 'formulas' ? D.formulas : (tab === 'constants' ? D.constants : D.principles);
    var make = tab === 'formulas' ? cardFormula : (tab === 'constants' ? cardConst : cardPrinciple);
    src.forEach(function (x) {
      var node = make(x);
      if (node) { grid.appendChild(node); n++; }
    });
    cnt.textContent = n;
    root.appendChild(n ? grid : el('div', 'r-empty', T.nothing || '—'));
  }

  fetch('/data/theory/reference.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      D = d; T = d[LANG] || d.ru;
      document.title = T.title + ' — bridge42worlds';
      document.getElementById('h').textContent = T.title;
      document.getElementById('sub').textContent = T.subtitle;
      document.getElementById('lead').textContent = T.lead;
      var q = document.getElementById('q');
      q.placeholder = T.search;
      q.addEventListener('input', function () { query = q.value.trim().toLowerCase(); draw(); });
      draw();
    })
    .catch(function (e) { root.appendChild(el('div', 'r-empty', String(e))); });
})();
</script>
<script src="/js/course-i18n.js?v=37e49bc0b4"></script>
<script src="/js/sitenav.js?v=3c332dac0c"></script>
<script src="/js/beta-banner.js?v=a16e674fd1" defer></script>
</body>
</html>
