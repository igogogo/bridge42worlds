<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Смелые гипотезы — bridge42worlds</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=87406f6ceb">
<style>
  /* Каждая гипотеза подана одинаково: утверждение, чем привлекательна, что её опровергнет.
     Статус вынесен на карточку меткой — читатель должен с первого взгляда видеть, где идёт
     проверяемая наука, а где рассуждение, которое проверить пока нечем. */
  .top-bar{display:flex;justify-content:space-between;align-items:center;
    max-width:var(--col-wide, 1100px);margin:0 auto 18px;padding:16px 16px 0}
  .logo{font-family:var(--font-display);font-size:15px;color:var(--soft);text-decoration:none}
  .logo:hover{color:var(--accent)}
  .theme-toggle{background:none;border:1px solid var(--line);color:var(--soft);border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:13px}

  .y-wrap{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 60px}
  .y-head h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin-bottom:8px}
  .y-sub{color:var(--soft);font-size:15px;margin-bottom:14px}
  .y-lead{max-width:70ch;font-size:15px;line-height:1.72}

  .y-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 4px}
  .y-chip{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--soft);display:inline-flex;gap:6px;align-items:center}
  .y-chip:hover{border-color:var(--accent);color:var(--accent)}
  .y-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .y-chip.on svg{color:#fff}
  .y-count{font-size:12.5px;color:var(--muted);margin-inline-start:auto}

  .y-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:18px}
  .y-card{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:16px 17px;
    transition:border-color .18s, box-shadow .18s, transform .18s;cursor:pointer}
  .y-card:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(20,30,45,.07);transform:translateY(-1px)}
  .y-t{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.32;
    display:flex;gap:9px;align-items:flex-start}
  .y-t svg{color:var(--accent);flex:none;margin-top:2px}
  .y-claim{font-size:13.5px;line-height:1.68;margin-top:10px}
  .y-row{font-size:13px;line-height:1.65;margin-top:10px;color:var(--soft)}
  .y-row b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700;margin-bottom:3px}
  .y-kill{border-inline-start:3px solid var(--line);padding-inline-start:11px}
  .y-card:not(.open) .y-row{display:none}
  .y-more{font-size:11.5px;color:var(--accent);margin-top:9px}
  .y-card.open .y-more{display:none}

  .y-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .y-b{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
    padding:3px 9px;border-radius:10px;white-space:nowrap}
  .y-b.tested{background:rgba(46,125,50,.13);color:#2e7d32}
  .y-b.minority{background:rgba(74,124,155,.14);color:#38617a}
  .y-b.untestable{background:rgba(184,134,11,.14);color:#8a6508}
  .y-b.beyond{background:rgba(120,120,130,.14);color:#6b7280}
  .y-b.field{background:var(--bg);color:var(--muted);font-weight:600}
  .y-empty{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:640px){ .y-grid{grid-template-columns:1fr} }
</style>
<script>
(function () {
  var allowed = ['ru', 'en', 'es', 'ar', 'fr'];
  var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  var saved = null;
  try { saved = localStorage.getItem('b42_lang'); } catch (e) {}
  var lang = allowed.indexOf(q) >= 0 ? q : (allowed.indexOf(saved) >= 0 ? saved : 'ru');
  window.B42_LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  try { localStorage.setItem('b42_lang', lang); } catch (e) {}
})();
</script>
<!-- b42:hreflang -->
<link rel="canonical" href="https://bridge42worlds.academy/hypotheses.html">
<link rel="alternate" hreflang="ru" href="https://bridge42worlds.academy/hypotheses.html">
<link rel="alternate" hreflang="en" href="https://bridge42worlds.academy/lang/en/hypotheses.html">
<link rel="alternate" hreflang="es" href="https://bridge42worlds.academy/lang/es/hypotheses.html">
<link rel="alternate" hreflang="ar" href="https://bridge42worlds.academy/lang/ar/hypotheses.html">
<link rel="alternate" hreflang="fr" href="https://bridge42worlds.academy/lang/fr/hypotheses.html">
<link rel="alternate" hreflang="x-default" href="https://bridge42worlds.academy/hypotheses.html">
<!-- /b42:hreflang -->
</head>
<body>

<div class="top-bar">
  <a href="/learn.html" class="logo">bridge42worlds</a>
  <button type="button" class="theme-toggle" onclick="var h=document.documentElement;h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');">◐</button>
</div>

<div class="y-wrap">
  <div class="y-head">
    <h1 id="h"></h1>
    <div class="y-sub" id="sub"></div>
    <p class="y-lead" id="lead"></p>
  </div>
  <div class="y-tools" id="tools"></div>
  <div id="root"></div>
</div>

<script src="/js/icons.js?v=f08dcc525c"></script>
<script>
(function () {
  var LANG = window.B42_LANG || 'ru';
  var root = document.getElementById('root'), tools = document.getElementById('tools');
  var MORE = { ru: 'подробнее', en: 'more', es: 'más', ar: 'المزيد' }[LANG] || 'подробнее';

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function ic(n, s) { return (window.B42Icons && B42Icons[n]) ? B42Icons[n](s || 16) : ''; }

  fetch('/data/theory/hypotheses.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var T = B42Lang.pick(d) || d.ru;
      document.title = T.title + ' — bridge42worlds';
      document.getElementById('h').textContent = T.title;
      document.getElementById('sub').textContent = T.subtitle;
      document.getElementById('lead').textContent = T.lead;

      var field = null, status = null;

      function chip(html, on, fn) {
        var b = el('button', 'y-chip' + (on ? ' on' : ''), html);
        b.type = 'button'; b.addEventListener('click', fn); tools.appendChild(b); return b;
      }

      function draw() {
        tools.innerHTML = '';
        chip(T.allFields, field === null && status === null, function () { field = null; status = null; draw(); });
        Object.keys(d.fields).forEach(function (k) {
          var f = d.fields[k];
          chip(ic(f.icon, 14) + ' ' + (f[LANG] || f.ru), field === k, function () {
            field = (field === k) ? null : k; draw();
          });
        });
        Object.keys(d.levels).forEach(function (k) {
          var s = d.levels[k];
          chip(s[LANG] || s.ru, status === k, function () { status = (status === k) ? null : k; draw(); });
        });
        var cnt = el('span', 'y-count'); tools.appendChild(cnt);

        root.innerHTML = '';
        var grid = el('div', 'y-grid'), n = 0;
        d.items.forEach(function (it) {
          if (field && it.field !== field) return;
          if (status && it.status !== status) return;
          var loc = (T.items || {})[it.id];
          if (!loc) return;
          n++;
          var c = el('div', 'y-card');
          c.appendChild(el('div', 'y-t', ic(it.icon) + '<span>' + loc.title + '</span>'));
          c.appendChild(el('div', 'y-claim', loc.claim));

          var why = el('div', 'y-row');
          why.innerHTML = '<b>' + T.whyLabel + '</b>' + loc.why;
          c.appendChild(why);

          var kill = el('div', 'y-row y-kill');
          kill.innerHTML = '<b>' + T.killLabel + '</b>' + loc.kill;
          c.appendChild(kill);

          var bs = el('div', 'y-badges');
          var st = d.levels[it.status] || {};
          bs.appendChild(el('span', 'y-b ' + it.status, st[LANG] || st.ru || it.status));
          var fl = d.fields[it.field] || {};
          bs.appendChild(el('span', 'y-b field', fl[LANG] || fl.ru || it.field));
          c.appendChild(bs);
          c.appendChild(el('div', 'y-more', MORE + ' →'));

          c.addEventListener('click', function () { c.classList.toggle('open'); });
          grid.appendChild(c);
        });
        cnt.textContent = n;
        root.appendChild(n ? grid : el('div', 'y-empty', '—'));
      }
      draw();
    })
    .catch(function (e) { root.appendChild(el('div', 'y-empty', String(e))); });
})();
</script>
<script src="/js/course-i18n.js?v=7568985970"></script>
<script src="/js/sitenav.js?v=cf6fd79772"></script>
<script src="/js/beta-banner.js?v=bc6f74ea82" defer></script>
</body>
</html>
