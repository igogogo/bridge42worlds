  .lead{font-size:19px; color:var(--muted); max-width:900px; line-height:1.5; margin-bottom:26px}

  svg{width:100%; height:auto; display:block; color:var(--ink)}
  figcaption{font-size:15.5px; color:var(--muted); line-height:1.55; margin-top:18px;
             border-top:1px solid var(--line); padding-top:14px; max-width:1100px}
  figcaption b{color:var(--ink)}
  .legend{display:flex; gap:26px; flex-wrap:wrap; font-size:14.5px; color:var(--muted);
          margin-top:14px; align-items:center}
  .sw{display:inline-block; width:26px; height:11px; vertical-align:-1px; margin-right:7px;

    РАЗДЕЛЕНИЕ, НА КОТОРОМ ВСЁ ДЕРЖИТСЯ</text>
  <text x="636" y="938" font-size="12.5" fill="#5b6b7a">
    ФАКТЫ живут в поле: обновляются ежедневно, бесплатно, со ссылками — модель их не помнит и не выдумывает.</text>
  <text x="636" y="957" font-size="12.5" fill="#5b6b7a">
    В ВЕСА зашивается только ОПТИКА — умение видеть связь, которую заводская модель считает далёкой.</text>

<figcaption>
  <b>Что показывает схема.</b> Механизм, ради которого всё построено, — во втором ярусе:
  области нарезаются по <i>мировому</i> корпусу, и в каждой сравниваются две плотности.
  Столбики схематичны; реальные числа — 600 областей, 53 слепые зоны, полнота 93,4%.
  Нарезка именно по миру, а не по себе, принципиальна: нарежь по своему корпусу — области
  возникнут вокруг собственных тем, и покрытие всегда выйдет стопроцентным.
  <br><br>
  <b>Два механизма отбора — не один подешевле.</b> Вектор превращает запрос и документ
  в числа <i>порознь</i> и потому отвечает «про то же ли это». Реранкер читает пару
  <i>вместе</i> и отвечает «стоит ли это читать». Это разные вопросы, и второй нельзя
  получить из первого никаким порогом.
  <br><br>
  <b>Пунктир — то, что строится:</b> компас, дообученный на связях домена. Сплошные
  линии — то, что работает и замерено.
</figcaption>
