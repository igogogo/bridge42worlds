<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ретроспектива открытий — bridge42worlds</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css?v=804ecb3567">
<style>
  /* Линия времени открытий. Годы охватывают четыреста тысяч лет, поэтому ось не может быть
     линейной: она разбита на эпохи равной ширины, а внутри эпохи год отложен пропорционально.
     Так первобытный огонь не сжимает всю остальную историю в точку. */
  .top-bar{display:flex;justify-content:space-between;align-items:center;
    max-width:var(--col-wide, 1100px);margin:0 auto 18px;padding:16px 16px 0}
  .logo{font-family:var(--font-display);font-size:15px;color:var(--soft);text-decoration:none}
  .logo:hover{color:var(--accent)}
  .theme-toggle{background:none;border:1px solid var(--line);color:var(--soft);border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:13px}
  .d-wrap{max-width:var(--col-wide, 1100px);margin:0 auto;padding:0 16px 60px}
  .d-head{margin:26px 0 20px}
  .d-head h1{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin-bottom:8px}
  .d-sub{color:var(--soft);font-size:15px;margin-bottom:14px}
  .d-lead{max-width:70ch;font-size:15px;line-height:1.72;color:var(--ink)}

  .d-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 6px}
  .d-chip{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--soft);display:inline-flex;
    align-items:center;gap:6px;transition:border-color .18s,color .18s,background-color .18s}
  .d-chip:hover{border-color:var(--accent);color:var(--accent)}
  .d-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .d-chip.on svg{color:#fff}
  .d-count{font-size:12.5px;color:var(--muted);margin-inline-start:auto}

  .d-era{margin:30px 0 10px;display:flex;align-items:center;gap:10px}
  .d-era-n{font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);white-space:nowrap}
  .d-era::after{content:"";flex:1;height:2px;background:var(--line)}

  .d-line{position:relative;padding-inline-start:26px}
  .d-line::before{content:"";position:absolute;inset-inline-start:7px;top:4px;bottom:4px;width:2px;
    background:linear-gradient(180deg,var(--line),var(--accent-soft,var(--line)),var(--line))}

  .d-item{position:relative;margin:0 0 12px;cursor:pointer}
  .d-item::before{content:"";position:absolute;inset-inline-start:-23px;top:16px;width:11px;height:11px;
    border-radius:50%;background:var(--bg);border:2px solid var(--accent);transition:transform .18s}
  .d-item:hover::before{transform:scale(1.35)}
  .d-item.acc::before{border-color:#b8860b;background:#b8860b}

  .d-card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface);
    transition:border-color .18s, box-shadow .18s, transform .18s}
  .d-item:hover .d-card{border-color:var(--accent);box-shadow:0 3px 14px rgba(20,30,45,.07);transform:translateY(-1px)}
  .d-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .d-year{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap}
  .d-title{font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.3}
  .d-who{font-size:12.5px;color:var(--muted)}
  .d-badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:10px;
    background:rgba(184,134,11,.12);color:#8a6508;font-weight:700;white-space:nowrap}
  .d-what{font-size:13.5px;line-height:1.65;color:var(--ink);margin-top:7px;max-width:74ch}
  .d-led{font-size:12.5px;line-height:1.6;color:var(--soft);margin-top:8px;display:flex;gap:7px;align-items:flex-start}
  .d-led b{color:var(--muted);font-weight:700;white-space:nowrap}
  .d-branch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
  .d-branch svg{color:var(--accent)}

  /* свёрнутый вид: подробности открываются по нажатию, чтобы страница читалась целиком */
  .d-item:not(.open) .d-what{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .d-item:not(.open) .d-led{display:none}

  .d-empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
  @media (max-width:640px){
    .d-line{padding-inline-start:20px}
    .d-line::before{inset-inline-start:5px}
    .d-item::before{inset-inline-start:-19px}
    .d-card{padding:11px 12px}
    .d-title{font-size:15.5px}
  }
</style>
<script>
// Язык страницы — общий с сайтом (см. course-i18n.js)
(function () {
  var allowed = ['ru', 'en', 'es', 'ar', 'fr'];
  var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  var saved = null;
  try { saved = localStorage.getItem('b42_lang'); } catch (e) {}
  var lang = allowed.indexOf(q) >= 0 ? q : (allowed.indexOf(saved) >= 0 ? saved : 'ru');
  window.B42_LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  try { localStorage.setItem('b42_lang', lang); } catch (e) {}
})();
</script>
</head>
<body>

<div class="top-bar">
  <a href="/learn.html" class="logo">bridge42worlds</a>
  <button type="button" class="theme-toggle" onclick="var h=document.documentElement;h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');">◐</button>
</div>

<div class="d-wrap">
  <div class="d-head">
    <h1 id="h"></h1>
    <div class="d-sub" id="sub"></div>
    <p class="d-lead" id="lead"></p>
  </div>
  <div class="d-tools" id="tools"></div>
  <div id="root"></div>
</div>

<script src="/js/icons.js?v=56338f6aee"></script>
<script>
(function () {
  var LANG = window.B42_LANG || 'ru';
  var root = document.getElementById('root');
  var UI = {
    ru: { all: 'все ветви', acc: 'случайные находки', found: 'открытий', reset: 'сбросить',
          err: 'Не удалось загрузить ретроспективу' },
    en: { all: 'all branches', acc: 'accidental finds', found: 'discoveries', reset: 'reset',
          err: 'Could not load the retrospective' },
    es: { all: 'todas las ramas', acc: 'hallazgos accidentales', found: 'descubrimientos',
          reset: 'restablecer', err: 'No se pudo cargar la retrospectiva' },
    ar: { all: 'كل الفروع', acc: 'اكتشافات بالمصادفة', found: 'اكتشافاً', reset: 'إعادة ضبط',
          err: 'تعذّر تحميل الاستعراض' }
  }[LANG] || {};

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function ic(n, s) { return (window.B42Icons && B42Icons[n]) ? B42Icons[n](s || 14) : ''; }

  function yearText(y) {
    if (y > 0) return String(y);
    var a = Math.abs(y);
    // «400 000 лет назад» читается лучше, чем «−400000»
    var back = a + 2026;
    var round1k = back >= 100000 ? Math.round(back / 50000) * 50 : Math.round(back / 1000);
    return back >= 10000 ? round1k + ' 000 ' + ({ ru: 'лет назад', en: 'years ago',
      es: 'años atrás', ar: 'سنة مضت' }[LANG] || '') : a + ' ' + ({ ru: 'до н. э.', en: 'BCE',
      es: 'a. C.', ar: 'ق.م' }[LANG] || '');
  }

  fetch('/data/theory/discoveries.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var T = B42Lang.pick(d) || d.ru;
      document.title = T.title + ' — bridge42worlds';
      document.getElementById('h').textContent = T.title;
      document.getElementById('sub').textContent = T.subtitle;
      document.getElementById('lead').textContent = T.lead;

      var state = { branch: null, onlyAcc: false };
      var tools = document.getElementById('tools');

      function chip(labelHtml, active, onClick) {
        var b = el('button', 'd-chip' + (active ? ' on' : ''), labelHtml);
        b.type = 'button';
        b.addEventListener('click', onClick);
        tools.appendChild(b);
        return b;
      }

      function renderTools() {
        tools.innerHTML = '';
        chip(UI.all, state.branch === null, function () { state.branch = null; draw(); });
        Object.keys(d.branches).forEach(function (key) {
          var br = d.branches[key];
          chip(ic(br.icon) + ' ' + (br[LANG] || br.ru), state.branch === key, function () {
            state.branch = (state.branch === key) ? null : key; draw();
          });
        });
        chip(ic('warn') + ' ' + UI.acc, state.onlyAcc, function () {
          state.onlyAcc = !state.onlyAcc; draw();
        });
        var cnt = el('span', 'd-count');
        cnt.id = 'cnt';
        tools.appendChild(cnt);
      }

      function draw() {
        renderTools();
        root.innerHTML = '';
        var list = d.items.filter(function (it) {
          if (state.branch && it.branch !== state.branch) return false;
          if (state.onlyAcc && !it.accident) return false;
          return true;
        }).sort(function (a, b) { return a.year - b.year; });

        document.getElementById('cnt').textContent = list.length + ' ' + UI.found;
        if (!list.length) { root.appendChild(el('div', 'd-empty', '—')); return; }

        var era = null, line = null;
        list.forEach(function (it) {
          if (it.era !== era) {
            era = it.era;
            var h = el('div', 'd-era');
            h.appendChild(el('span', 'd-era-n', (T.eraLabels && T.eraLabels[era]) || era));
            root.appendChild(h);
            line = el('div', 'd-line');
            root.appendChild(line);
          }
          var loc = (T.items && T.items[it.id]) || it;
          var br = d.branches[it.branch] || {};
          var node = el('div', 'd-item' + (it.accident ? ' acc' : ''));
          var card = el('div', 'd-card');

          var top = el('div', 'd-top');
          top.appendChild(el('span', 'd-year', yearText(it.year)));
          top.appendChild(el('span', 'd-title', loc.title || it.title));
          if (it.accident) top.appendChild(el('span', 'd-badge', T.accidentLabel));
          card.appendChild(top);

          var meta = el('div', 'd-who');
          meta.innerHTML = (loc.who || it.who) + ' · <span class="d-branch">' +
            ic(br.icon, 12) + (br[LANG] || br.ru || '') + '</span>';
          card.appendChild(meta);

          card.appendChild(el('div', 'd-what', loc.what || it.what));
          var led = el('div', 'd-led');
          led.innerHTML = ic('star', 13) + '<b>' + T.ledLabel + ':</b> ' + (loc.led || it.led);
          card.appendChild(led);

          node.appendChild(card);
          node.addEventListener('click', function () { node.classList.toggle('open'); });
          line.appendChild(node);
        });
      }

      draw();
    })
    .catch(function (e) {
      root.appendChild(el('p', 'd-empty', (UI.err || 'error') + ': ' + e));
    });
})();
</script>
<script src="/js/course-i18n.js?v=7bcba42fcd"></script>
<script src="/js/sitenav.js?v=5e7001ccdd"></script>
<script src="/js/beta-banner.js?v=bc6f74ea82" defer></script>
</body>
</html>
